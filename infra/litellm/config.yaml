# LiteLLM proxy configuration for local development.
#
# Mounted read-only at /app/config.yaml by infra/docker-compose.dev.yml. This
# file holds no real provider keys: secrets come from the environment (see
# infra/.env.example). The proxy stores keys, budgets and spend in Postgres.
#
# To add a real provider, add a model entry like:
#
#   - model_name: claude
#     litellm_params:
#       model: anthropic/claude-sonnet-4-5
#       api_key: os.environ/ANTHROPIC_API_KEY
#
# and put ANTHROPIC_API_KEY in infra/.env (never in this file).

model_list:
  # Placeholder with a fake provider, so the proxy can boot without any real
  # API key. Replace it with real providers when you need them.
  - model_name: placeholder
    litellm_params:
      model: openai/placeholder
      api_key: os.environ/PLACEHOLDER_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
