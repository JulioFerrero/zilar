<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202020"/>
      <stop offset="0.55" stop-color="#101010"/>
      <stop offset="1" stop-color="#060606"/>
    </linearGradient>
    <linearGradient id="keyEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="keyGlow" cx="0.5" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#e6e9ed"/>
      <stop offset="0.45" stop-color="#aab2bc"/>
      <stop offset="0.53" stop-color="#7a828d"/>
      <stop offset="0.62" stop-color="#a3abb5"/>
      <stop offset="0.8" stop-color="#d7dce1"/>
      <stop offset="1" stop-color="#aab1ba"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#7b838e"/>
      <stop offset="1" stop-color="#3b4048"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur18" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="bubbleClip"><path id="bubblePath" d="M356 258H668A126 126 0 0 1 794 384V576A126 126 0 0 1 668 702H478L340 792L372 702H356A126 126 0 0 1 230 576V384A126 126 0 0 1 356 258Z"/></clipPath>
  </defs>
  <!-- raised key -->
  <rect x="100" y="112" width="824" height="824" rx="190" fill="#000" opacity="0.55" filter="url(#blur18)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#key)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#keyGlow)"/>
  <rect x="103" y="103" width="818" height="818" rx="187" fill="none" stroke="url(#keyEdge)" stroke-width="6"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="none" stroke="#050505" stroke-width="3"/>
  <!-- bubble shadow -->
  <path d="M356 258H668A126 126 0 0 1 794 384V576A126 126 0 0 1 668 702H478L340 792L372 702H356A126 126 0 0 1 230 576V384A126 126 0 0 1 356 258Z" transform="translate(0 34)" fill="#000" opacity="0.7" filter="url(#blur18)"/>
  <!-- chrome bubble -->
  <use xlink:href="#bubblePath" fill="url(#chrome)"/>
  <g clip-path="url(#bubbleClip)">
    <ellipse cx="450" cy="330" rx="190" ry="50" fill="url(#spec)" transform="rotate(-8 450 330)"/>
    <path d="M230 590C340 628 440 636 512 636C620 636 720 620 794 576L794 720L230 720Z" fill="#ffffff" opacity="0.12"/>
    <use xlink:href="#bubblePath" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="22" filter="url(#blur6)"/>
  </g>
  <use xlink:href="#bubblePath" fill="none" stroke="url(#rim)" stroke-width="5"/>
</svg>
