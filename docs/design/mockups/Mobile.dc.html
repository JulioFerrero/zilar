<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zilar mobile chat list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Geist',system-ui,sans-serif;color:#ededed}
a{color:#ededed}a:hover{color:#ffffff}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
.btn-primary{box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 0 rgba(0,0,0,.2),inset 0 0 0 1px rgba(255,255,255,.12),0 1px 0 rgba(0,0,0,.95),0 2px 3px rgba(0,0,0,.7),0 10px 18px -8px rgba(0,0,0,.95);transition:transform .08s,box-shadow .08s}
.btn-primary:active{transform:translateY(1px);box-shadow:inset 0 2px 5px rgba(0,0,0,.35),0 1px 0 rgba(0,0,0,.95)}
.btn-icon{box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.65),0 1px 0 rgba(0,0,0,.95),0 3px 6px -1px rgba(0,0,0,.75);transition:transform .08s,box-shadow .08s}
.btn-icon svg{filter:drop-shadow(0 1px 0 rgba(0,0,0,.95))}
.btn-icon:active{transform:translateY(1px);box-shadow:inset 0 2px 5px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.05)}
.seg-on{box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.6),0 1px 0 rgba(0,0,0,.9),0 2px 4px rgba(0,0,0,.7);text-shadow:0 -1px 0 rgba(0,0,0,.7)}
.well{box-shadow:inset 0 2px 6px rgba(0,0,0,.9),inset 0 1px 1px rgba(0,0,0,.8),inset 0 0 0 1px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.06)}
.bubble-out{box-shadow:inset 0 1px 0 #ffffff,inset 0 -3px 6px rgba(0,0,0,.08),0 1px 0 rgba(0,0,0,.95),0 4px 10px -3px rgba(0,0,0,.85);text-shadow:0 1px 0 rgba(255,255,255,.8)}
.bubble-in{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.6),0 1px 0 rgba(0,0,0,.95),0 4px 10px -3px rgba(0,0,0,.85);text-shadow:0 -1px 0 rgba(0,0,0,.7)}
.bubble-gen{box-shadow:inset 0 2px 6px rgba(0,0,0,.9),inset 0 0 0 1px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.06)}
.raised-pill{box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 1px 0 rgba(0,0,0,.9),0 2px 4px rgba(0,0,0,.6)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: #000000; padding-top: 54px;">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 16px;">
<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em;">Chats</h1>
<button type="button" aria-label="Settings" class="btn-icon" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #2c2c2c, #151515); border: 1px solid #050505; color: #d4d4d4; box-sizing: border-box; border-radius: 12px;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
</button>
</div>

<label class="well" style="margin: 4px 16px 10px; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #0c0c0c; border: 1px solid #1f1f1f; border-radius: 12px; color: #8a8a8a; font-size: 15px;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input type="text" placeholder="Search" aria-label="Search chats" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #ededed; font: inherit;">
</label>

<div class="well" style="margin: 0 16px 8px; padding: 3px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; background: #0c0c0c; border: 1px solid #1a1a1a; border-radius: 12px;">
<button type="button" class="seg-on" style="height: 34px; border: 0; border-radius: 9px; background: linear-gradient(180deg, #333333, #1c1c1c); color: #ededed; font: 500 13px 'Geist',sans-serif;">All</button>
<button type="button" style="height: 34px; border: 0; border-radius: 9px; background: transparent; color: #a1a1a1; font: 500 13px 'Geist',sans-serif;">Personal</button>
<button type="button" style="height: 34px; border: 0; border-radius: 9px; background: transparent; color: #a1a1a1; font: 500 13px 'Geist',sans-serif;">AIs</button>
<button type="button" style="height: 34px; border: 0; border-radius: 9px; background: transparent; color: #a1a1a1; font: 500 13px 'Geist',sans-serif;">Work</button>
</div>

<nav aria-label="Chats" style="display: flex; flex-direction: column;">
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; text-decoration: none;">
<span style="width: 52px; height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #ededed; color: #0a0a0a; font-weight: 600; font-size: 17px;">DT</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid #1a1a1a;">
<span style="display: flex; align-items: center; gap: 6px;">
<span style="font-size: 16px; font-weight: 600;">deep test</span>
<span class="mono" style="font-size: 10px; color: #a1a1a1; border: 1px solid #333333; border-radius: 5px; padding: 0 4px; line-height: 15px;">AI</span>
<span class="mono" style="margin-left: auto; font-size: 12px; color: #8a8a8a;">20:28</span>
</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #a1a1a1;"><span class="pulse" style="width: 6px; height: 6px; border-radius: 999px; background: #a1a1a1;"></span>writing…</span>
</span>
</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; text-decoration: none;">
<span style="width: 52px; height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #262626; color: #ededed; font-weight: 600; font-size: 17px;">GA</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid #1a1a1a;">
<span style="display: flex; align-items: center; gap: 6px;">
<span style="font-size: 16px; font-weight: 600;">Zilar amigos</span>
<span class="mono" style="margin-left: auto; font-size: 12px; color: #8a8a8a;">00:30</span>
</span>
<span style="display: flex; align-items: center; gap: 8px;">
<span style="flex-grow: 1; min-width: 0; font-size: 14px; color: #a1a1a1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"><span style="color: #d4d4d4;">Claude:</span> Good catch, two bugs: the group…</span>
<span class="btn-primary" style="min-width: 22px; height: 22px; padding: 0 7px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,0.4), rgba(255,255,255,0.08) 48%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.14)), {{accent}}; text-shadow: {{accentTextShadow}}; color: {{accentText}}; font-size: 12px; font-weight: 600;">2</span>
</span>
</span>
</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; text-decoration: none;">
<span style="width: 52px; height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #1a1a1a; border: 1px solid #333333; box-sizing: border-box; color: #ededed; font-weight: 600; font-size: 17px;">CT</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid #1a1a1a;">
<span style="display: flex; align-items: center; gap: 6px;">
<span style="font-size: 16px; font-weight: 600;">Claude (test)</span>
<span class="mono" style="margin-left: auto; font-size: 12px; color: #8a8a8a;">00:17</span>
</span>
<span style="font-size: 14px; color: #a1a1a1;">You: hello?</span>
</span>
</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; text-decoration: none;">
<span style="width: 52px; height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #262626; color: #ededed; font-weight: 600; font-size: 17px;">AN</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid #1a1a1a;">
<span style="display: flex; align-items: center; gap: 6px;">
<span style="font-size: 16px; font-weight: 600;">Ana</span>
<span class="mono" style="margin-left: auto; font-size: 12px; color: #8a8a8a;">Sun</span>
</span>
<span style="font-size: 14px; color: #a1a1a1;">[LAST MESSAGE PREVIEW]</span>
</span>
</a>
</nav>

<button type="button" aria-label="New chat" class="btn-primary" style="position: absolute; right: 20px; bottom: 34px; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 18px; background: linear-gradient(180deg, rgba(255,255,255,0.4), rgba(255,255,255,0.08) 48%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.14)), {{accent}}; text-shadow: {{accentTextShadow}}; color: {{accentText}}; box-shadow: 0 8px 24px rgba(0,0,0,0.6);">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ededed","options":["#ededed","#0070f3","#276ef1"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#ededed';
const light = accent.toLowerCase() === '#ededed' || accent.toLowerCase() === '#ffffff';
return { accent: accent, accentText: light ? '#0a0a0a' : '#ffffff', accentTextShadow: light ? '0 1px 0 rgba(255,255,255,0.7)' : '0 -1px 0 rgba(0,0,0,0.35)' };
}
}
</script>
</body>
</html>
