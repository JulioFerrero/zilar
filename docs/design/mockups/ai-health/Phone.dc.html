<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My AIs, phone</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Geist',system-ui,sans-serif;color:#ededed}
a{color:#ededed}a:hover{color:#ffffff}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.key-icon{background:linear-gradient(180deg,#2c2c2c,#151515);border:1px solid #050505;color:#d4d4d4;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.65),0 1px 0 rgba(0,0,0,.95),0 3px 6px -1px rgba(0,0,0,.75)}
.badge{font-family:'Geist Mono',monospace;font-size:10px;color:#a1a1a1;border:1px solid #333;border-radius:5px;padding:0 4px;line-height:16px}
.row{display:flex;align-items:center;gap:12px;min-height:72px;padding:0 16px;border:0;background:transparent;color:#ededed;text-align:left;width:100%;box-sizing:border-box;font-family:'Geist',sans-serif;text-decoration:none}
.body{flex-grow:1;min-width:0;align-self:stretch;display:flex;align-items:center;gap:10px;border-bottom:1px solid #1a1a1a}
.orb{position:relative;width:48px;height:48px;border-radius:999px;flex-shrink:0}
.health{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:999px;box-shadow:0 0 0 2px #0a0a0a}
.name{font-size:16px;font-weight:600}
.meta{font-size:14px;color:#a1a1a1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{width:56px;height:4px;border-radius:2px;background:#0c0c0c;box-shadow:inset 0 1px 1px rgba(0,0,0,.8);overflow:hidden}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0a0a0a; display: flex; flex-direction: column">
  <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; padding: 0 16px">
    <button type="button" aria-label="New AI" class="key-icon" style="width: 40px; height: 40px; box-sizing: border-box; border-radius: 12px; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>
  <h1 style="margin: 0 16px 12px 16px; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">My AIs</h1>

  <div style="display: flex; flex-direction: column">
    <a href="#dev-1" class="row">
      <span class="orb" style="background: radial-gradient(circle at 35% 30%, #c4b5fd, #4338ca 55%, #1e1b4b)"><span class="health" style="background: #22c55e" role="img" aria-label="Working"></span></span>
      <span class="body">
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="display: flex; align-items: center; gap: 6px"><span class="name">Dev-1</span><span class="badge">AI</span></span>
          <span class="meta">gpt-4o · OpenAI</span>
        </span>
        <span class="mono" style="font-size: 12px; color: #d4d4d4">$0.42</span>
      </span>
    </a>
    <a href="#qa-1" class="row">
      <span class="orb" style="background: radial-gradient(circle at 35% 30%, #bbf7d0, #15803d 55%, #052e16)"><span class="health" style="background: #ef4444" role="img" aria-label="Failing"></span></span>
      <span class="body">
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="display: flex; align-items: center; gap: 6px"><span class="name">QA-1</span><span class="badge">AI</span></span>
          <span class="meta" style="color: #ef4444">Key rejected</span>
        </span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px">
          <span class="mono" style="font-size: 12px; color: #d4d4d4">$0.00 <span style="color: #8a8a8a">/ $2</span></span>
          <span class="bar" aria-hidden="true"><span style="display: block; width: 0%; height: 100%; background: #ededed"></span></span>
        </span>
      </span>
    </a>
    <a href="#marketing-ai" class="row">
      <span class="orb" style="background: radial-gradient(circle at 35% 30%, #fef9c3, #a16207 55%, #3f2a05)"><span class="health" style="background: #f59e0b" role="img" aria-label="Paused by its limit"></span></span>
      <span class="body" style="border-bottom: 0">
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="display: flex; align-items: center; gap: 6px"><span class="name">Marketing AI</span><span class="badge">AI</span></span>
          <span class="meta" style="color: #f59e0b">Daily limit reached</span>
        </span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px">
          <span class="mono" style="font-size: 12px; color: #d4d4d4">$5.00 <span style="color: #8a8a8a">/ $5</span></span>
          <span class="bar" aria-hidden="true"><span style="display: block; width: 100%; height: 100%; background: #f59e0b"></span></span>
        </span>
      </span>
    </a>
  </div>
</div>
</x-dc>

</html>
