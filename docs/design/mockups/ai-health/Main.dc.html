<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My AIs, web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Geist',system-ui,sans-serif;color:#ededed}
a{color:#ededed}a:hover{color:#ffffff}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.key-icon{background:linear-gradient(180deg,#2c2c2c,#151515);border:1px solid #050505;color:#d4d4d4;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.65),0 1px 0 rgba(0,0,0,.95),0 3px 6px -1px rgba(0,0,0,.75)}
.key-primary{background:linear-gradient(180deg,rgba(255,255,255,.40),rgba(255,255,255,.08) 48%,rgba(0,0,0,0) 52%,rgba(0,0,0,.14)),#ededed;color:#0a0a0a;border:0;text-shadow:0 1px 0 rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 0 rgba(0,0,0,.2),inset 0 0 0 1px rgba(255,255,255,.12),0 1px 0 rgba(0,0,0,.95),0 2px 3px rgba(0,0,0,.7),0 10px 18px -8px rgba(0,0,0,.95)}
.badge{font-family:'Geist Mono',monospace;font-size:10px;color:#a1a1a1;border:1px solid #333;border-radius:5px;padding:0 4px;line-height:16px}
.row{display:flex;align-items:center;gap:14px;padding:12px 10px 12px 14px;border-bottom:1px solid #1a1a1a}
.orb{position:relative;width:40px;height:40px;border-radius:999px;flex-shrink:0}
.health{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:999px;box-shadow:0 0 0 2px #111111}
.name{font-size:14px;font-weight:600}
.meta{font-size:13px;color:#a1a1a1}
.spend{display:flex;flex-direction:column;align-items:flex-end;gap:5px;width:96px;flex-shrink:0}
.bar{width:72px;height:4px;border-radius:2px;background:#0c0c0c;box-shadow:inset 0 1px 1px rgba(0,0,0,.8);overflow:hidden}
</style>
</helmet>
<div style="width: 1280px; height: 800px; background: #0a0a0a; display: flex; flex-direction: column">
  <header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #1f1f1f">
    <button type="button" aria-label="Back" class="key-icon" style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 10px; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
    <h1 style="margin: 0; flex-grow: 1; font-size: 17px; font-weight: 600; letter-spacing: -0.02em">My AIs</h1>
    <button type="button" class="key-primary" style="height: 36px; padding: 0 14px 0 12px; border-radius: 10px; display: flex; align-items: center; gap: 6px; font: 600 14px 'Geist', sans-serif">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      New AI
    </button>
  </header>

  <main style="width: 640px; align-self: center; padding-top: 32px">
    <div style="background: #111111; border: 1px solid #1f1f1f; border-radius: 12px">
      <div class="row">
        <span class="orb" style="background: radial-gradient(circle at 35% 30%, #c4b5fd, #4338ca 55%, #1e1b4b)"><span class="health" style="background: #22c55e" role="img" aria-label="Working"></span></span>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="display: flex; align-items: center; gap: 6px"><span class="name">Dev-1</span><span class="badge">AI</span></span>
          <span class="meta">gpt-4o · OpenAI</span>
        </div>
        <div class="spend">
          <span class="mono" style="font-size: 12px; color: #d4d4d4">$0.42</span>
        </div>
        <button type="button" aria-label="Dev-1 actions" class="key-icon" style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 10px; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="12" cy="19" r="1.7"></circle></svg>
        </button>
      </div>

      <div class="row">
        <span class="orb" style="background: radial-gradient(circle at 35% 30%, #bbf7d0, #15803d 55%, #052e16)"><span class="health" style="background: #ef4444" role="img" aria-label="Failing"></span></span>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="display: flex; align-items: center; gap: 6px"><span class="name">QA-1</span><span class="badge">AI</span></span>
          <span class="meta"><span style="color: #ef4444">Key rejected</span> · <a href="#key" style="color: #ededed">Replace key</a></span>
        </div>
        <div class="spend">
          <span class="mono" style="font-size: 12px; color: #d4d4d4">$0.00 <span style="color: #8a8a8a">/ $2</span></span>
          <span class="bar" aria-hidden="true"><span style="display: block; width: 0%; height: 100%; background: #ededed"></span></span>
        </div>
        <button type="button" aria-label="QA-1 actions" class="key-icon" style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 10px; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="12" cy="19" r="1.7"></circle></svg>
        </button>
      </div>

      <div class="row" style="border-bottom: 0">
        <span class="orb" style="background: radial-gradient(circle at 35% 30%, #fef9c3, #a16207 55%, #3f2a05)"><span class="health" style="background: #f59e0b" role="img" aria-label="Paused by its limit"></span></span>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="display: flex; align-items: center; gap: 6px"><span class="name">Marketing AI</span><span class="badge">AI</span></span>
          <span class="meta"><span style="color: #f59e0b">Daily limit reached</span> · claude-sonnet-5</span>
        </div>
        <div class="spend">
          <span class="mono" style="font-size: 12px; color: #d4d4d4">$5.00 <span style="color: #8a8a8a">/ $5</span></span>
          <span class="bar" aria-hidden="true"><span style="display: block; width: 100%; height: 100%; background: #f59e0b"></span></span>
        </div>
        <button type="button" aria-label="Marketing AI actions" class="key-icon" style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 10px; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="12" cy="19" r="1.7"></circle></svg>
        </button>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
