<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Geist',system-ui,sans-serif;color:#ededed}
a{color:#ededed}a:hover{color:#ffffff}
.key-icon{background:linear-gradient(180deg,#2c2c2c,#151515);border:1px solid #050505;color:#d4d4d4;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.65),0 1px 0 rgba(0,0,0,.95),0 3px 6px -1px rgba(0,0,0,.75)}
.group{background:#111111;border:1px solid #1f1f1f;border-radius:14px;overflow:hidden}
.label{margin:0 0 8px 4px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a}
.row{display:flex;align-items:center;gap:12px;height:50px;padding:0 14px 0 12px;border-bottom:1px solid #1a1a1a;color:#ededed;text-decoration:none;font-size:16px}
.tile{width:30px;height:30px;border-radius:9px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pill{min-width:22px;height:22px;padding:0 7px;box-sizing:border-box;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#0a0a0a;background:linear-gradient(180deg,rgba(255,255,255,.40),rgba(255,255,255,.08) 48%,rgba(0,0,0,0) 52%,rgba(0,0,0,.14)),#ededed;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 1px 0 rgba(0,0,0,.95)}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #0a0a0a; padding: 0 16px 24px 16px; display: flex; flex-direction: column; gap: 20px">

    <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 600">You</span><span style="font-size: 14px; color: #a1a1a1">you@zilar.test</span></span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
  </a>

  <section>
    <h2 class="label">Account</h2>
    <div class="group">
      <a href="#requests" class="row"><span class="tile key-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M19 8v6M16 11h6"></path></svg></span><span style="flex-grow: 1">Contact requests</span><span class="pill">2</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
      <a href="#contacts" class="row"><span class="tile key-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .8 3 2.9 3 6"></path></svg></span><span style="flex-grow: 1">Contacts</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>

      <a href="#devices" class="row"><span class="tile key-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="13" height="10" rx="2"></rect><rect x="15" y="9" width="6" height="11" rx="1.5"></rect><path d="M7 18h5"></path></svg></span><span style="flex-grow: 1">Devices</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
      <a href="#notifications" class="row" style="border-bottom: 0"><span class="tile key-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"></path></svg></span><span style="flex-grow: 1">Notifications</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
    </div>
  </section>

  <section>
    <h2 class="label">AIs and tools</h2>
    <div class="group">
      <a href="#approvals" class="row"><span class="tile key-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.4-3 7.8-7 9-4-1.2-7-4.6-7-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg></span><span style="flex-grow: 1">Approvals</span><span class="pill">1</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
      <a href="#machines" class="row"><span class="tile key-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"></rect><rect x="3" y="13" width="18" height="7" rx="2"></rect><path d="M7 7.5h.01M7 16.5h.01"></path></svg></span><span style="flex-grow: 1">Machines</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
      <a href="#connections" class="row" style="border-bottom: 0"><span class="tile key-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l9-9M17 6l3 3M15 8l2 2"></path></svg></span><span style="flex-grow: 1">Connections</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
    </div>
  </section>

  <section>
    <h2 class="label">Chats</h2>
    <div class="group">
      <a href="#folders" class="row"><span class="tile key-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></span><span style="flex-grow: 1">Chat folders</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
      <a href="#stickers" class="row" style="border-bottom: 0"><span class="tile key-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3H6a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h7l8-8V6a3 3 0 0 0-3-3z"></path><path d="M13 21v-5a3 3 0 0 1 3-3h5"></path></svg></span><span style="flex-grow: 1">Stickers</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
    </div>
  </section>

  <button type="button" class="group" style="height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 12px; color: #ef4444; font: 16px 'Geist', sans-serif; text-align: left">
    <span class="tile" style="background: #1a0b0b; border: 1px solid #3a1414"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"></path></svg></span>
    Sign out
  </button>
</div>
