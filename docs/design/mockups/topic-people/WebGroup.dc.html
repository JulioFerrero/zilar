body{margin:0;background:#000;font-family:'Geist',system-ui,sans-serif;color:#ededed}

.panel{background:#0a0a0a;border:1px solid #1f1f1f;border-radius:16px;overflow:hidden}

.sec{font-size:12px;font-weight:600;color:#a1a1a1;padding:0 2px}
.st{display:flex;align-items:center;flex-shrink:0}
.st span{width:20px;height:20px;border-radius:999px;border:2px solid #111111;margin-left:-6px;box-sizing:border-box}

.dev{background:radial-gradient(circle at 35% 30%,#c4b5fd,#4338ca 55%,#1e1b4b)}
.cl{background:radial-gradient(circle at 34% 30%,#fed7aa 0%,#fb923c 25%,#c2410c 60%,#431407 100%)}

.tg{width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#171717;border:1px solid #232323;font-size:15px;font-weight:600;color:#d4d4d4}
.ghost{height:10px;border-radius:5px;background:#161616}
</style>
