<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Group, who's in each topic, phone</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Geist',system-ui,sans-serif;color:#ededed}
a{color:#ededed;text-decoration:none}a:hover{color:#ffffff}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.key-icon{background:linear-gradient(180deg,#2c2c2c,#151515);border:1px solid #050505;color:#d4d4d4;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.65),0 1px 0 rgba(0,0,0,.95),0 3px 6px -1px rgba(0,0,0,.75)}
.group{background:#111111;border:1px solid #1f1f1f;border-radius:14px;overflow:hidden;flex-shrink:0}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 12px;border-bottom:1px solid #1a1a1a;font-size:15px;box-sizing:border-box}
.ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-sizing:border-box}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#a1a1a1;flex:1 1 0}
.qkey{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.sec{font-size:13px;font-weight:600;color:#a1a1a1;padding:0 4px}
.st{display:flex;align-items:center;flex-shrink:0}
.st span{width:22px;height:22px;border-radius:999px;border:2px solid #111111;margin-left:-7px;box-sizing:border-box}
.st span:first-child{margin-left:0}
.dev{background:radial-gradient(circle at 35% 30%,#c4b5fd,#4338ca 55%,#1e1b4b)}
.cl{background:radial-gradient(circle at 34% 30%,#fed7aa 0%,#fb923c 25%,#c2410c 60%,#431407 100%)}
.p1{background:radial-gradient(circle at 34% 30%,#e0f2fe 0%,#38bdf8 25%,#0369a1 60%,#082f49 100%)}
.p2{background:radial-gradient(circle at 34% 30%,#fde68a 0%,#f59e0b 25%,#b45309 60%,#451a03 100%)}
.p3{background:radial-gradient(circle at 34% 30%,#d1fae5 0%,#34d399 25%,#047857 60%,#022c22 100%)}
.p4{background:radial-gradient(circle at 34% 30%,#ffd6f1 0%,#f472b6 25%,#c026d3 60%,#4a044e 100%)}
.grp{background:radial-gradient(circle at 34% 30%,#e0e7ff 0%,#818cf8 25%,#3730a3 60%,#1e1b4b 100%)}
.tg{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#171717;border:1px solid #232323;font-size:16px;font-weight:600;color:#d4d4d4}
.chev{flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 900px; background: #0a0a0a; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 12px; margin-top: 28px">
    <button type="button" aria-label="Back" class="key-icon" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 16px 16px 16px">
    <span aria-hidden="true" class="grp" style="width: 88px; height: 88px; border-radius: 999px; box-shadow: 0 10px 24px -8px rgba(0,0,0,.9)"></span>
    <h1 style="margin: 8px 0 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">ai test</h1>
    <span style="font-size: 14px; color: #a1a1a1">4 people · 2 AIs</span>
  </div>

  <div style="display: flex; gap: 8px; padding: 0 16px 16px 16px">
    <span class="qa"><button type="button" aria-label="Mute" class="key-icon qkey"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></button>Mute</span>
    <span class="qa"><button type="button" aria-label="Search" class="key-icon qkey"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>Search</span>
    <span class="qa"><a href="PhoneAdd.dc.html" aria-label="Add people or AIs" class="key-icon qkey"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"></path></svg></a>Add</span>
    <span class="qa"><button type="button" aria-label="More" class="key-icon qkey"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>More</span>
  </div>

  <div style="flex-grow: 1; padding: 0 16px 16px 16px; display: flex; flex-direction: column; gap: 14px">
    <a href="#people" class="group row" style="border-bottom: 1px solid #1f1f1f">
      <span class="st" aria-hidden="true"><span class="dev"></span><span class="cl"></span><span class="p1"></span><span class="p2"></span><span class="p3"></span></span>
      <span style="flex-grow: 1">People and AIs</span>
      <span class="mono" style="font-size: 13px; color: #a1a1a1">6</span>
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span class="sec">Topics</span>
      <nav aria-label="Topics" class="group">
        <a href="#general" class="row">
          <span class="tg" aria-hidden="true">#</span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span>General</span><span style="font-size: 13px; color: #8a8a8a">Everyone</span></span>
          <span class="st" aria-hidden="true"><span class="dev"></span><span class="cl"></span><span class="p1"></span><span class="p2"></span></span>
          <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
        <a href="Main.dc.html" class="row">
          <span class="tg" aria-hidden="true">#</span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span>Financial</span><span style="font-size: 13px; color: #8a8a8a">4 people · Deepseek</span></span>
          <span class="st" aria-hidden="true"><span class="dev"></span><span class="p1"></span><span class="p2"></span><span class="p3"></span></span>
          <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
        <a href="#design" class="row">
          <span class="tg" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#d4d4d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Private"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span>Design</span><span style="font-size: 13px; color: #8a8a8a">Julio, Marta · Claude</span></span>
          <span class="st" aria-hidden="true"><span class="cl"></span><span class="p1"></span><span class="p4"></span></span>
          <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
        <a href="#new-topic" class="row" style="border-bottom: 0; color: #d4d4d4">
          <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
          <span style="flex-grow: 1">New topic</span>
        </a>
      </nav>
    </div>

    <nav aria-label="More" class="group">
      <a href="#media" class="row">
        <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-3-3-9 9"></path></svg></span>
        <span style="flex-grow: 1">Shared media</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <a href="#tools" class="row">
        <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"></path></svg></span>
        <span style="flex-grow: 1">Tools and routines</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <a href="#settings" class="row" style="border-bottom: 0">
        <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg></span>
        <span style="flex-grow: 1">Settings</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </nav>
  </div>
</div>
</x-dc>
