<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add people or AIs, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Geist',system-ui,sans-serif;color:#ededed}
a{color:#ededed;text-decoration:none}a:hover{color:#ffffff}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.key-icon{background:linear-gradient(180deg,#2c2c2c,#151515);border:1px solid #050505;color:#d4d4d4;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.65),0 1px 0 rgba(0,0,0,.95),0 3px 6px -1px rgba(0,0,0,.75)}
.well{background:#0c0c0c;border:1px solid #1f1f1f;box-shadow:inset 0 2px 6px rgba(0,0,0,.9),inset 0 1px 1px rgba(0,0,0,.8),inset 0 0 0 1px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.06)}
.group{background:#111111;border:1px solid #1f1f1f;border-radius:14px;overflow:hidden;flex-shrink:0}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 10px 0 12px;border-bottom:1px solid #1a1a1a;font-size:16px;box-sizing:border-box}
.sec{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.06em;color:#8a8a8a;padding:0 4px}
.av{width:34px;height:34px;border-radius:999px;flex-shrink:0}
.badge{font-family:'Geist Mono',monospace;font-size:10px;color:#a1a1a1;border:1px solid #333;border-radius:5px;padding:1px 5px}
.tag{font-family:'Geist Mono',monospace;font-size:11px;color:#8a8a8a}
.dev{background:radial-gradient(circle at 35% 30%,#c4b5fd,#4338ca 55%,#1e1b4b)}
.glm{background:radial-gradient(circle at 34% 30%,#fecaca 0%,#f87171 25%,#b91c1c 60%,#450a0a 100%)}
.cl{background:radial-gradient(circle at 34% 30%,#fed7aa 0%,#fb923c 25%,#c2410c 60%,#431407 100%)}
.seg{display:flex;padding:3px;gap:2px;border-radius:12px;background:#0c0c0c;border:1px solid #1a1a1a;box-shadow:inset 0 2px 6px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.06)}
.seg button{flex:1 1 0;height:36px;border:0;border-radius:9px;background:transparent;color:#a1a1a1;font:500 15px 'Geist',sans-serif;cursor:pointer}
.seg .on{background:linear-gradient(180deg,#333,#1c1c1c);color:#ededed;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.6),0 1px 0 rgba(0,0,0,.9),0 2px 4px rgba(0,0,0,.7)}
.key{box-sizing:border-box;height:36px;padding:0 14px;border-radius:10px;font-family:'Geist',system-ui,sans-serif;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.key-light{border:1px solid #ffffff;color:#0a0a0a;background:linear-gradient(180deg,#ffffff,#d9d9d9);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 2px 6px rgba(0,0,0,.6)}
.done{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:#8a8a8a;padding:0 6px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #050505">
  <div aria-hidden="true" style="position: absolute; inset: 0; background-color: #0a0a0a; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 22px 22px; opacity: .45"></div>

  <section aria-label="Add people or AIs to Financial" style="position: absolute; left: 0; right: 0; bottom: 0; top: 64px; display: flex; flex-direction: column; gap: 14px; padding: 10px 16px 30px 16px; box-sizing: border-box; background: #0d0d0d; border-top: 1px solid #1f1f1f; border-radius: 24px 24px 0 0; box-shadow: 0 -12px 30px rgba(0,0,0,.8)">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #3a3a3a"></span>

    <div style="display: flex; align-items: center; gap: 12px">
      <span style="flex-grow: 1; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Add to Financial</span>
      <a href="PhonePeople.dc.html" aria-label="Close" class="key-icon" style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <div class="seg" role="tablist" aria-label="Add">
      <button type="button" role="tab" aria-selected="false">People</button>
      <button type="button" role="tab" aria-selected="true" class="on">AIs</button>
    </div>

    <label class="well" style="height: 44px; border-radius: 12px; display: flex; align-items: center; gap: 10px; padding: 0 12px; box-sizing: border-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input aria-label="Search AIs" placeholder="Search AIs" style="flex-grow: 1; background: transparent; border: 0; outline: none; color: #ededed; font: 16px 'Geist', sans-serif">
    </label>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span class="sec">IN AI TEST</span>
      <div class="group">
        <div class="row">
          <span aria-hidden="true" class="av dev"></span>
          <span style="flex-grow: 1; display: flex; align-items: center; gap: 6px">Deepseek <span class="badge">AI</span></span>
          <button type="button" class="key key-light">Add</button>
        </div>
        <div class="row" style="border-bottom: 0">
          <span aria-hidden="true" class="av cl"></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="display: flex; align-items: center; gap: 6px">Claude <span class="badge">AI</span></span><span style="font-size: 13px; color: #8a8a8a">Marta's</span></span>
          <span class="done"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="#22c55e"></circle><path d="M4.9 8.3l2.1 2.1 4.1-4.5" stroke="#0a0a0a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>Here</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span class="sec">YOUR OTHER AIS</span>
      <div class="group">
        <div class="row" style="border-bottom: 0">
          <span aria-hidden="true" class="av glm"></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="display: flex; align-items: center; gap: 6px">GLM <span class="badge">AI</span></span><span class="tag">+ joins ai test</span></span>
          <button type="button" class="key key-light">Add</button>
        </div>
      </div>
    </div>

    <a href="#new-ai" class="group" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 12px; font-size: 16px">
      <span class="key-icon" style="width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
      <span style="flex-grow: 1">New AI</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </section>
</div>
</x-dc>

</body>
</html>
