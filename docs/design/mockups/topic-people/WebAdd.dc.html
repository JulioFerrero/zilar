body{margin:0;background:#000;font-family:'Geist',system-ui,sans-serif;color:#ededed}

.sec{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.06em;color:#8a8a8a;padding:0 2px}
.av{width:30px;height:30px;border-radius:999px;flex-shrink:0}

.key{box-sizing:border-box;height:32px;padding:0 12px;border-radius:10px;font-family:'Geist',system-ui,sans-serif;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.key-light{border:1px solid #ffffff;color:#0a0a0a;background:linear-gradient(180deg,#ffffff,#d9d9d9);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 2px 6px rgba(0,0,0,.6)}
.key-dark{border:1px solid #2a2a2a;color:#ededed;background:linear-gradient(180deg,#1c1c1c,#121212);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 2px 6px rgba(0,0,0,.6)}
