<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Several files, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Geist',system-ui,sans-serif;color:#ededed}
a{color:#ededed}a:hover{color:#ffffff}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.key-icon{background:linear-gradient(180deg,#2c2c2c,#151515);border:1px solid #050505;color:#d4d4d4;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.65),0 1px 0 rgba(0,0,0,.95),0 3px 6px -1px rgba(0,0,0,.75)}
.key-primary{background:linear-gradient(180deg,rgba(255,255,255,.40),rgba(255,255,255,.08) 48%,rgba(0,0,0,0) 52%,rgba(0,0,0,.14)),#ededed;color:#0a0a0a;border:0;text-shadow:0 1px 0 rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 0 rgba(0,0,0,.2),inset 0 0 0 1px rgba(255,255,255,.12),0 1px 0 rgba(0,0,0,.95),0 2px 3px rgba(0,0,0,.7),0 10px 18px -8px rgba(0,0,0,.95)}
.well{background:#0c0c0c;box-shadow:inset 0 2px 6px rgba(0,0,0,.9),inset 0 1px 1px rgba(0,0,0,.8),inset 0 0 0 1px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.06)}
.tile{position:relative;width:72px;height:72px;flex-shrink:0;border-radius:12px;box-sizing:border-box}
.ftile{background:#161616;border:1px solid #262626;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.x{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:999px;border:0;background:rgba(0,0,0,.85);color:#ededed;display:flex;align-items:center;justify-content:center;padding:0}
.ext{font-family:'Geist Mono',monospace;font-size:10px;font-weight:500;color:#d4d4d4}
.size{font-family:'Geist Mono',monospace;font-size:10px;color:#8a8a8a}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background-color: #0a0a0a; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 22px 22px">
  <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #0a0a0a; border-bottom: 1px solid #1a1a1a">
    <button type="button" aria-label="Back" class="key-icon" style="width: 40px; height: 40px; box-sizing: border-box; border-radius: 12px; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
    <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 999px; background: radial-gradient(circle at 35% 30%, #fecaca, #dc2626 55%, #450a0a)"></span>
    <span style="flex-grow: 1; font-size: 16px; font-weight: 600">Marta</span>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="flex-shrink: 0; padding: 12px 12px 28px 12px; background: #0a0a0a; border-top: 1px solid #1a1a1a; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 10px; padding-top: 7px; overflow: hidden" aria-label="4 files to send">
      <span class="tile" style="background: linear-gradient(135deg, #3f3f46, #18181b)" role="img" aria-label="flat-1.jpg">
        <button type="button" aria-label="Remove flat-1.jpg" class="x"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </span>
      <span class="tile" style="background: linear-gradient(135deg, #52525b, #27272a)" role="img" aria-label="flat-2.jpg">
        <button type="button" aria-label="Remove flat-2.jpg" class="x"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </span>
      <span class="tile ftile" role="img" aria-label="lease-2027.pdf, 1.2 MB">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a1a1a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4"></path></svg>
        <span class="ext">PDF</span>
        <span class="size">1.2 MB</span>
        <button type="button" aria-label="Remove lease-2027.pdf" class="x"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </span>
      <span class="tile ftile" role="img" aria-label="floor-plan.zip, 8.4 MB">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a1a1a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4"></path></svg>
        <span class="ext">ZIP</span>
        <span class="size">8.4 MB</span>
        <button type="button" aria-label="Remove floor-plan.zip" class="x"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" aria-label="Attach" class="key-icon" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 14px; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"></path></svg>
      </button>
      <span class="well" style="flex-grow: 1; height: 44px; border-radius: 14px; display: flex; align-items: center; padding: 0 14px; font-size: 15px; color: #8a8a8a">Add a caption</span>
      <button type="button" aria-label="Send 4 files" class="key-primary" style="width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>

return {};
}

</body>
</html>
