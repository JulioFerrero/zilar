<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Group members, web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Geist',system-ui,sans-serif;color:#ededed}
a{color:#ededed;text-decoration:none}a:hover{color:#ffffff}
.key-icon{background:linear-gradient(180deg,#2c2c2c,#151515);border:1px solid #050505;color:#d4d4d4;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.65),0 1px 0 rgba(0,0,0,.95),0 3px 6px -1px rgba(0,0,0,.75)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.group{background:#111111;border:1px solid #1f1f1f;border-radius:12px;overflow:hidden;flex-shrink:0}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 8px 0 12px;border-bottom:1px solid #1a1a1a;color:#ededed;font-size:14px;box-sizing:border-box}
.orb{width:36px;height:36px;border-radius:999px;flex-shrink:0;box-shadow:0 6px 14px -6px rgba(0,0,0,.9)}
.sub{font-size:12px;color:#a1a1a1}
.tag{font-size:11px;color:#d4d4d4;background:#1c1c1c;border:1px solid #2a2a2a;border-radius:6px;padding:1px 6px}
.ai{font-size:10px;font-weight:600;color:#a1a1a1;border:1px solid #333;border-radius:4px;padding:0 4px;letter-spacing:.04em}
.more{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;color:#737373}
.head{font-size:13px;font-weight:600;color:#a1a1a1;padding:0 4px}
.ghost{height:14px;border-radius:7px;background:#161616}
</style>
</helmet>
<div style="width: 1280px; height: 800px; background: #0a0a0a; display: flex; gap: 12px; padding: 12px; box-sizing: border-box">
  <div aria-hidden="true" style="width: 300px; border-radius: 16px; background: #0d0d0d; border: 1px solid #1a1a1a; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <div class="ghost" style="width: 70%"></div><div class="ghost" style="width: 55%"></div><div class="ghost" style="width: 80%"></div><div class="ghost" style="width: 60%"></div><div class="ghost" style="width: 75%"></div>
  </div>
  <div aria-hidden="true" style="flex-grow: 1; border-radius: 16px; background: #0d0d0d; border: 1px solid #1a1a1a; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div class="ghost" style="width: 30%; height: 18px"></div>
    <div class="ghost" style="width: 45%; height: 34px; border-radius: 12px; margin-top: 30px"></div>
    <div class="ghost" style="width: 38%; height: 34px; border-radius: 12px"></div>
    <div class="ghost" style="width: 52%; height: 34px; border-radius: 12px; align-self: flex-end"></div>
  </div>

  <aside aria-label="Dev team members" style="width: 380px; flex-shrink: 0; border-radius: 16px; background: #0d0d0d; border: 1px solid #1f1f1f; display: flex; flex-direction: column; overflow: hidden">
    <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px">
      <a href="Main.dc.html" aria-label="Back to group info" class="key-icon" style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 10px; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <h2 style="margin: 0; flex-grow: 1; font-size: 16px; font-weight: 600">Members</h2>
      <button type="button" aria-label="Close group info" class="key-icon" style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 10px; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <div style="flex-grow: 1; overflow: hidden; padding: 0 12px 12px 12px; display: flex; flex-direction: column; gap: 10px">
      <label style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 10px; background: #111111; border: 1px solid #1f1f1f">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search members</span>
        <input type="search" placeholder="Search" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #ededed; font: 14px 'Geist', sans-serif">
      </label>

      <div class="group">
        <button type="button" class="row" style="width: 100%; background: transparent; border: 0; border-bottom: 1px solid #1a1a1a; font: 14px 'Geist', sans-serif; text-align: left; min-height: 48px">
          <span class="key-icon" style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"></path></svg>
          </span>
          <span style="flex-grow: 1">Add members</span>
        </button>
        <button type="button" class="row" style="width: 100%; background: transparent; border: 0; font: 14px 'Geist', sans-serif; text-align: left; min-height: 48px">
          <span class="key-icon" style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg>
          </span>
          <span style="flex-grow: 1">Invite with a link</span>
        </button>
      </div>

      <span class="head">People · <span class="mono">4</span></span>
      <ul aria-label="People" class="group" style="list-style: none; margin: 0; padding: 0">
        <li class="row">
          <span class="orb" style="background: radial-gradient(circle at 34% 30%, #e0f2fe 0%, #38bdf8 25%, #2563eb 60%, #172554 100%)" aria-hidden="true"></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="display: flex; align-items: center; gap: 6px">You
              <svg role="img" aria-label="Owner" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e5b84b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"></path></svg>
            </span>
            <span style="display: flex; gap: 4px"><span class="tag">Designers</span><span class="tag">Devs</span></span>
          </span>
        </li>
        <li class="row">
          <span class="orb" style="background: radial-gradient(circle at 34% 30%, #fef3c7 0%, #fbbf24 25%, #d97706 60%, #451a03 100%)" aria-hidden="true"></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="display: flex; align-items: center; gap: 6px">Ana
              <svg role="img" aria-label="Admin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a1a1a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            </span>
            <span style="display: flex; gap: 4px"><span class="tag">Designers</span></span>
          </span>
          <button type="button" aria-label="Options for Ana" class="more"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button>
        </li>
        <li class="row">
          <span class="orb" style="background: radial-gradient(circle at 34% 30%, #dcfce7 0%, #4ade80 25%, #16a34a 60%, #052e16 100%)" aria-hidden="true"></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="display: flex; align-items: center; gap: 6px">Luis<span aria-label="online" role="img" style="width: 7px; height: 7px; border-radius: 99px; background: #22c55e"></span></span>
            <span style="display: flex; gap: 4px"><span class="tag">Devs</span></span>
          </span>
          <button type="button" aria-label="Options for Luis" class="more"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button>
        </li>
        <li class="row" style="border-bottom: 0">
          <span class="orb" style="background: radial-gradient(circle at 34% 30%, #ede9fe 0%, #a78bfa 25%, #7c3aed 60%, #2e1065 100%)" aria-hidden="true"></span>
          <span style="flex-grow: 1">Marco</span>
          <button type="button" aria-label="Options for Marco" class="more"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button>
        </li>
      </ul>

      <span class="head">AIs · <span class="mono">2</span></span>
      <ul aria-label="AIs" class="group" style="list-style: none; margin: 0; padding: 0">
        <li class="row">
          <span class="orb" style="background: radial-gradient(circle at 34% 30%, #fae8ff 0%, #c084fc 25%, #7e22ce 60%, #1e0533 100%)" aria-hidden="true"></span>
          <span style="flex-grow: 1; display: flex; align-items: center; gap: 6px">Dev-1 <span class="ai">AI</span></span>
          <button type="button" aria-label="Options for Dev-1" class="more"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button>
        </li>
        <li class="row" style="border-bottom: 0">
          <span class="orb" style="background: radial-gradient(circle at 34% 30%, #ccfbf1 0%, #2dd4bf 25%, #0d9488 60%, #042f2e 100%)" aria-hidden="true"></span>
          <span style="flex-grow: 1; display: flex; align-items: center; gap: 6px">QA-1 <span class="ai">AI</span></span>
          <button type="button" aria-label="Options for QA-1" class="more"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button>
        </li>
      </ul>

      <a href="#" class="group" style="height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 12px; font-size: 14px">
        <span style="flex-grow: 1">Roles</span><span class="mono" style="font-size: 12px; color: #a1a1a1">2</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
