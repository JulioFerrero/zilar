<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Group info, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Geist',system-ui,sans-serif;color:#ededed}
a{color:#ededed;text-decoration:none}a:hover{color:#ffffff}
.key-icon{background:linear-gradient(180deg,#2c2c2c,#151515);border:1px solid #050505;color:#d4d4d4;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.65),0 1px 0 rgba(0,0,0,.95),0 3px 6px -1px rgba(0,0,0,.75)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.group{background:#111111;border:1px solid #1f1f1f;border-radius:14px;overflow:hidden;flex-shrink:0}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px 0 12px;border-bottom:1px solid #1a1a1a;color:#ededed;font-size:15px;box-sizing:border-box}
.ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-sizing:border-box}
.count{font-size:13px;color:#a1a1a1}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#a1a1a1;flex:1 1 0}
.qkey{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
</style>
</helmet>
<div style="width: 390px; height: 900px; background: #0a0a0a; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 12px; margin-top: 28px">
    <button type="button" aria-label="Back" class="key-icon" style="width: 40px; height: 40px; box-sizing: border-box; border-radius: 12px; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 16px 18px 16px">
    <span aria-hidden="true" style="width: 96px; height: 96px; border-radius: 999px; background: radial-gradient(circle at 34% 30%, #ffd6f1 0%, #f472b6 22%, #c026d3 55%, #4a044e 100%); box-shadow: 0 10px 24px -8px rgba(0,0,0,.9)"></span>
    <h1 style="margin: 8px 0 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">Dev team</h1>
    <span style="font-size: 14px; color: #a1a1a1">6 members</span>
  </div>

  <div style="display: flex; gap: 8px; padding: 0 16px 18px 16px">
    <span class="qa"><button type="button" aria-label="Mute" class="key-icon qkey"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></button>Mute</span>
    <span class="qa"><button type="button" aria-label="Search" class="key-icon qkey"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>Search</span>
    <span class="qa"><button type="button" aria-label="Add members" class="key-icon qkey"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"></path></svg></button>Add</span>
    <span class="qa"><button type="button" aria-label="More" class="key-icon qkey"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>More</span>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 0 16px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <nav aria-label="People" class="group">
      <a href="#" class="row">
        <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0M17 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"></path></svg></span>
        <span style="flex-grow: 1">Members</span><span class="count mono">6</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <a href="#" class="row">
        <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"></rect><path d="M12 8V4M9 14h.01M15 14h.01"></path></svg></span>
        <span style="flex-grow: 1">AIs</span><span class="count mono">2</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <a href="#" class="row" style="border-bottom: 0">
        <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg></span>
        <span style="flex-grow: 1">Invite links</span><span class="count mono">2</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </nav>

    <nav aria-label="Content" class="group">
      <a href="#" class="row">
        <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-3-3-9 9"></path></svg></span>
        <span style="flex-grow: 1">Shared media</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <a href="#" class="row">
        <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M9 10.8V5h6v5.8l2 3.2H7z"></path></svg></span>
        <span style="flex-grow: 1">Pinned messages</span><span class="count mono">3</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <a href="#" class="row">
        <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"></path></svg></span>
        <span style="flex-grow: 1">Tools and routines</span><span class="count mono">1 · 2</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <a href="#" class="row">
        <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg></span>
        <span style="flex-grow: 1">Activity</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <a href="#" class="row" style="border-bottom: 0">
        <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg></span>
        <span style="flex-grow: 1">Always allowed</span><span class="count mono">0</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </nav>

    <nav aria-label="Settings" class="group">
      <a href="#" class="row" style="border-bottom: 0">
        <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg></span>
        <span style="flex-grow: 1">Settings</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </nav>

    <button type="button" class="group" style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 14px; color: #ef4444; font: 15px 'Geist', sans-serif; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
      Leave group
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
