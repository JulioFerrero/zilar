<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Group info, web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Geist',system-ui,sans-serif;color:#ededed}
a{color:#ededed;text-decoration:none}a:hover{color:#ffffff}
.key-icon{background:linear-gradient(180deg,#2c2c2c,#151515);border:1px solid #050505;color:#d4d4d4;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.65),0 1px 0 rgba(0,0,0,.95),0 3px 6px -1px rgba(0,0,0,.75)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.group{background:#111111;border:1px solid #1f1f1f;border-radius:12px;overflow:hidden;flex-shrink:0}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 10px 0 12px;border-bottom:1px solid #1a1a1a;color:#ededed;font-size:14px;box-sizing:border-box}
.ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-sizing:border-box}
.count{font-size:12px;color:#a1a1a1}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#a1a1a1;width:64px}
.qkey{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.ghost{height:14px;border-radius:7px;background:#161616}
</style>
</helmet>
<div style="width: 1280px; height: 840px; background: #0a0a0a; display: flex; gap: 12px; padding: 12px; box-sizing: border-box">
  <div aria-hidden="true" style="width: 300px; border-radius: 16px; background: #0d0d0d; border: 1px solid #1a1a1a; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <div class="ghost" style="width: 70%"></div><div class="ghost" style="width: 55%"></div><div class="ghost" style="width: 80%"></div><div class="ghost" style="width: 60%"></div><div class="ghost" style="width: 75%"></div>
  </div>
  <div aria-hidden="true" style="flex-grow: 1; border-radius: 16px; background: #0d0d0d; border: 1px solid #1a1a1a; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div class="ghost" style="width: 30%; height: 18px"></div>
    <div class="ghost" style="width: 45%; height: 34px; border-radius: 12px; margin-top: 30px"></div>
    <div class="ghost" style="width: 38%; height: 34px; border-radius: 12px"></div>
    <div class="ghost" style="width: 52%; height: 34px; border-radius: 12px; align-self: flex-end"></div>
  </div>

  <aside aria-label="Dev team info" style="width: 380px; flex-shrink: 0; border-radius: 16px; background: #0d0d0d; border: 1px solid #1f1f1f; display: flex; flex-direction: column; overflow: hidden">
    <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px">
      <button type="button" aria-label="Close group info" class="key-icon" style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 10px; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 16px 16px 16px">
      <span aria-hidden="true" style="width: 84px; height: 84px; border-radius: 999px; background: radial-gradient(circle at 34% 30%, #ffd6f1 0%, #f472b6 22%, #c026d3 55%, #4a044e 100%); box-shadow: 0 10px 24px -8px rgba(0,0,0,.9)"></span>
      <h2 style="margin: 6px 0 0 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Dev team</h2>
      <span style="font-size: 13px; color: #a1a1a1">6 members</span>
    </div>
    <div style="display: flex; justify-content: center; gap: 4px; padding-bottom: 18px">
      <span class="qa"><button type="button" aria-label="Mute" class="key-icon qkey"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></button>Mute</span>
      <span class="qa"><button type="button" aria-label="Search" class="key-icon qkey"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>Search</span>
      <span class="qa"><button type="button" aria-label="Add members" class="key-icon qkey"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"></path></svg></button>Add</span>
      <span class="qa"><button type="button" aria-label="More" class="key-icon qkey"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>More</span>
    </div>

    <div style="flex-grow: 1; overflow: hidden; padding: 0 12px 12px 12px; display: flex; flex-direction: column; gap: 10px">
      <nav aria-label="People" class="group">
        <a href="WebMembers.dc.html" class="row">
          <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0M17 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"></path></svg></span>
          <span style="flex-grow: 1">Members</span><span class="count mono">6</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
        <a href="#" class="row">
          <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"></rect><path d="M12 8V4M9 14h.01M15 14h.01"></path></svg></span>
          <span style="flex-grow: 1">AIs</span><span class="count mono">2</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
        <a href="#" class="row" style="border-bottom: 0">
          <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg></span>
          <span style="flex-grow: 1">Invite links</span><span class="count mono">2</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </nav>

      <nav aria-label="Content" class="group">
        <a href="#" class="row">
          <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-3-3-9 9"></path></svg></span>
          <span style="flex-grow: 1">Shared media</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
        <a href="#" class="row">
          <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M9 10.8V5h6v5.8l2 3.2H7z"></path></svg></span>
          <span style="flex-grow: 1">Pinned messages</span><span class="count mono">3</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
        <a href="#" class="row">
          <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"></path></svg></span>
          <span style="flex-grow: 1">Tools and routines</span><span class="count mono">1 · 2</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
        <a href="#" class="row">
          <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg></span>
          <span style="flex-grow: 1">Activity</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
        <a href="#" class="row" style="border-bottom: 0">
          <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg></span>
          <span style="flex-grow: 1">Always allowed</span><span class="count mono">0</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </nav>

      <nav aria-label="Settings" class="group">
        <a href="#" class="row" style="border-bottom: 0">
          <span class="ico key-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span>
          <span style="flex-grow: 1">Settings</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </nav>

      <button type="button" class="group" style="height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; color: #ef4444; font: 14px 'Geist', sans-serif; text-align: left">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
        Leave group
      </button>
    </div>
  </aside>
</div>
</x-dc>
