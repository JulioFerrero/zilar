<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approval card, web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Geist',system-ui,sans-serif;color:#ededed}
a{color:#ededed}a:hover{color:#ffffff}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.key-icon{background:linear-gradient(180deg,#2c2c2c,#151515);border:1px solid #050505;color:#d4d4d4;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.65),0 1px 0 rgba(0,0,0,.95),0 3px 6px -1px rgba(0,0,0,.75)}
.key-primary{background:linear-gradient(180deg,rgba(255,255,255,.40),rgba(255,255,255,.08) 48%,rgba(0,0,0,0) 52%,rgba(0,0,0,.14)),#ededed;color:#0a0a0a;border:0;text-shadow:0 1px 0 rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 0 rgba(0,0,0,.2),inset 0 0 0 1px rgba(255,255,255,.12),0 1px 0 rgba(0,0,0,.95),0 2px 3px rgba(0,0,0,.7),0 10px 18px -8px rgba(0,0,0,.95)}
.well{background:#0c0c0c;box-shadow:inset 0 2px 6px rgba(0,0,0,.9),inset 0 1px 1px rgba(0,0,0,.8),inset 0 0 0 1px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.06)}
.orb{width:28px;height:28px;border-radius:999px;flex-shrink:0;background:radial-gradient(circle at 35% 30%,#c4b5fd,#4338ca 55%,#1e1b4b)}
.key{height:36px;padding:0 16px;border-radius:10px;font:600 14px 'Geist',sans-serif}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 12px; display: flex; gap: 12px; background: #000000; overflow: hidden">
  <div style="width: 300px; flex-shrink: 0; background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 16px"></div>

  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; background-color: #0a0a0a; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 22px 22px; border: 1px solid #1f1f1f; border-radius: 16px; overflow: hidden">
    <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid #1f1f1f; background: #0a0a0a">
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: radial-gradient(circle at 35% 30%, #fbcfe8, #db2777 55%, #500724)"></span>
      <span style="font-size: 15px; font-weight: 600">Dev team</span>
      <span style="font-size: 14px; color: #737373">›</span>
      <span style="font-size: 15px; font-weight: 600">General</span>
    </div>

    <div style="flex-grow: 1; padding: 24px; display: flex; flex-direction: column; justify-content: flex-end; gap: 16px">
      <div style="align-self: flex-end; max-width: 420px; padding: 9px 14px; border-radius: 16px; background: #ededed; color: #0a0a0a; font-size: 14px">Merge it when the tests pass.</div>

      <div style="align-self: flex-start; display: flex; gap: 10px; align-items: flex-end">
        <span class="orb" aria-hidden="true"></span>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 12px; background: #141414; border: 1px solid #232323; font-size: 14px; color: #a1a1a1">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Approved"><path d="M5 12l5 5L20 7"></path></svg>
            Run the tests on PR #42
          </div>

          <section aria-label="Dev-1 asks to merge PR #42" style="width: 400px; box-sizing: border-box; padding: 16px; border-radius: 12px; background: #141414; border: 1px solid #232323; display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 13px; color: #a1a1a1">Dev-1 asks</span>
              <span style="font-size: 16px; font-weight: 600; line-height: 22px">Merge PR #42 into main</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px">
              <button type="button" style="height: 36px; padding: 0 4px; border: 0; background: transparent; color: #a1a1a1; font: 500 13px 'Geist', sans-serif">Always allow</button>
              <span style="flex-grow: 1"></span>
              <button type="button" class="key-icon key" style="font-weight: 500">Deny</button>
              <button type="button" class="key-primary key">Approve</button>
            </div>
          </section>
        </div>
      </div>
    </div>

    <div style="flex-shrink: 0; padding: 10px 16px 14px 16px; border-top: 1px solid #1f1f1f; background: #0a0a0a; display: flex; align-items: center; gap: 8px">
      <span class="well" style="flex-grow: 1; height: 38px; border-radius: 11px; display: flex; align-items: center; padding: 0 12px; font-size: 14px; color: #8a8a8a">Message General</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
