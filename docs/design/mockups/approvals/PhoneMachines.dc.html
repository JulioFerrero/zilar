<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Machines, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Geist',system-ui,sans-serif;color:#ededed}
a{color:#ededed}a:hover{color:#ffffff}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.key-icon{background:linear-gradient(180deg,#2c2c2c,#151515);border:1px solid #050505;color:#d4d4d4;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.65),0 1px 0 rgba(0,0,0,.95),0 3px 6px -1px rgba(0,0,0,.75)}
.key-primary{background:linear-gradient(180deg,rgba(255,255,255,.40),rgba(255,255,255,.08) 48%,rgba(0,0,0,0) 52%,rgba(0,0,0,.14)),#ededed;color:#0a0a0a;border:0;text-shadow:0 1px 0 rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 0 rgba(0,0,0,.2),inset 0 0 0 1px rgba(255,255,255,.12),0 1px 0 rgba(0,0,0,.95),0 2px 3px rgba(0,0,0,.7),0 10px 18px -8px rgba(0,0,0,.95)}
.well{background:#0c0c0c;box-shadow:inset 0 2px 6px rgba(0,0,0,.9),inset 0 1px 1px rgba(0,0,0,.8),inset 0 0 0 1px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.06)}
.kb{width:40px;height:40px;box-sizing:border-box;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.key{flex:1 1 0;height:44px;border-radius:12px;font:600 15px 'Geist',sans-serif}
.dot{width:9px;height:9px;border-radius:999px;flex-shrink:0}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border-bottom:1px solid #1a1a1a;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0a0a0a; display: flex; flex-direction: column">
  <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px">
    <button type="button" aria-label="Back" class="key-icon kb">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
    <button type="button" aria-label="Add machine" class="key-icon kb">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>
  <h1 style="margin: 4px 16px 16px 16px; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Machines</h1>

  <div style="margin: 0 16px; display: flex; flex-direction: column; gap: 16px">
    <section aria-label="office-linux wants to join" style="background: #111111; border: 1px solid #1f1f1f; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span class="dot" style="background: #f59e0b" role="img" aria-label="Waiting"></span>
        <span style="font-size: 16px; font-weight: 600">office-linux</span>
      </div>
      <span class="well mono" style="height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 17px; letter-spacing: 0.08em">a1b2 c3d4 e5f6 0718</span>
      <span style="font-size: 14px; color: #a1a1a1">Approve if the machine shows this code.</span>
      <div style="display: flex; gap: 8px">
        <button type="button" class="key-icon key" style="font-weight: 500">Deny</button>
        <button type="button" class="key-primary key">Approve</button>
      </div>
    </section>

    <div style="background: #111111; border: 1px solid #1f1f1f; border-radius: 14px; overflow: hidden">
      <a href="#dev-mac" class="row">
        <span class="dot" style="background: #22c55e" role="img" aria-label="Online"></span>
        <span style="flex-grow: 1; font-size: 16px; font-weight: 500">dev-mac</span>
        <span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 999px; background: radial-gradient(circle at 35% 30%, #c4b5fd, #4338ca 55%, #1e1b4b)"></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <a href="#home-pc" class="row">
        <span class="dot" style="background: #525252" role="img" aria-label="Offline"></span>
        <span style="flex-grow: 1; font-size: 16px; font-weight: 500">home-pc</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <a href="#revoked" class="row" style="border-bottom: 0; color: #a1a1a1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M6 6l12 12"></path></svg>
        <span style="flex-grow: 1; font-size: 16px">Revoked</span>
        <span class="mono" style="font-size: 12px">1</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
