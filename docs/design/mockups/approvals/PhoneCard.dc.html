<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approval card, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Geist',system-ui,sans-serif;color:#ededed}
a{color:#ededed}a:hover{color:#ffffff}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.key-icon{background:linear-gradient(180deg,#2c2c2c,#151515);border:1px solid #050505;color:#d4d4d4;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.65),0 1px 0 rgba(0,0,0,.95),0 3px 6px -1px rgba(0,0,0,.75)}
.key-primary{background:linear-gradient(180deg,rgba(255,255,255,.40),rgba(255,255,255,.08) 48%,rgba(0,0,0,0) 52%,rgba(0,0,0,.14)),#ededed;color:#0a0a0a;border:0;text-shadow:0 1px 0 rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 0 rgba(0,0,0,.2),inset 0 0 0 1px rgba(255,255,255,.12),0 1px 0 rgba(0,0,0,.95),0 2px 3px rgba(0,0,0,.7),0 10px 18px -8px rgba(0,0,0,.95)}
.well{background:#0c0c0c;box-shadow:inset 0 2px 6px rgba(0,0,0,.9),inset 0 1px 1px rgba(0,0,0,.8),inset 0 0 0 1px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.06)}
.key{flex:1 1 0;height:44px;border-radius:12px;font:600 15px 'Geist',sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background-color: #0a0a0a; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 22px 22px">
  <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #0a0a0a; border-bottom: 1px solid #1a1a1a">
    <button type="button" aria-label="Back" class="key-icon" style="width: 40px; height: 40px; box-sizing: border-box; border-radius: 12px; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
    <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 999px; background: radial-gradient(circle at 35% 30%, #fbcfe8, #db2777 55%, #500724)"></span>
    <span style="flex-grow: 1; font-size: 16px; font-weight: 600">General</span>
  </div>

  <div style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px">
    <div style="align-self: flex-end; max-width: 280px; padding: 9px 14px; border-radius: 18px; background: #ededed; color: #0a0a0a; font-size: 15px">Merge it when the tests pass.</div>

    <div style="align-self: flex-start; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 14px; background: #141414; border: 1px solid #232323; font-size: 15px; color: #a1a1a1">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Approved"><path d="M5 12l5 5L20 7"></path></svg>
      Run the tests on PR #42
    </div>

    <section aria-label="Dev-1 asks to merge PR #42" style="padding: 16px; border-radius: 14px; background: #141414; border: 1px solid #232323; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; color: #a1a1a1">Dev-1 asks</span>
        <span style="font-size: 17px; font-weight: 600; line-height: 24px">Merge PR #42 into main</span>
      </div>
      <div style="display: flex; gap: 8px">
        <button type="button" class="key-icon key" style="font-weight: 500">Deny</button>
        <button type="button" class="key-primary key">Approve</button>
      </div>
      <button type="button" style="align-self: center; height: 36px; padding: 0 8px; border: 0; background: transparent; color: #a1a1a1; font: 500 14px 'Geist', sans-serif">Always allow</button>
    </section>
  </div>

  <div style="flex-shrink: 0; padding: 8px 12px 28px 12px; background: #0a0a0a; border-top: 1px solid #1a1a1a; display: flex; align-items: center; gap: 8px">
    <span class="well" style="flex-grow: 1; height: 44px; border-radius: 14px; display: flex; align-items: center; padding: 0 14px; font-size: 15px; color: #8a8a8a">Message General</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

return {};
}
}
</script>
</body>
</html>
