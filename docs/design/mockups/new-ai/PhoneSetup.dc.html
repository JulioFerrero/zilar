<head>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Geist',system-ui,sans-serif;color:#ededed}
a{color:#ededed}a:hover{color:#ffffff}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.key-primary{background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.08) 48%,rgba(0,0,0,0) 52%,rgba(0,0,0,.14)),#ededed;color:#0a0a0a;text-shadow:0 1px 0 rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 0 rgba(0,0,0,.2),inset 0 0 0 1px rgba(255,255,255,.12),0 1px 0 rgba(0,0,0,.95),0 2px 3px rgba(0,0,0,.7),0 10px 18px -8px rgba(0,0,0,.95)}
.key-icon{background:linear-gradient(180deg,#2c2c2c,#151515);border:1px solid #050505;color:#d4d4d4;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.65),0 1px 0 rgba(0,0,0,.95),0 3px 6px -1px rgba(0,0,0,.75)}
.key-icon svg{filter:drop-shadow(0 1px 0 rgba(0,0,0,.95))}
.well{background:#0c0c0c;box-shadow:inset 0 2px 6px rgba(0,0,0,.9),inset 0 1px 1px rgba(0,0,0,.8),inset 0 0 0 1px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.06)}
.seg-on{background:linear-gradient(180deg,#333333,#1c1c1c);color:#ededed;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.6),0 1px 0 rgba(0,0,0,.9),0 2px 4px rgba(0,0,0,.7);text-shadow:0 -1px 0 rgba(0,0,0,.7)}
.sel{background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.08) 48%,rgba(0,0,0,0) 52%,rgba(0,0,0,.14)),#ededed !important;color:#0a0a0a !important;text-shadow:0 1px 0 rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 0 rgba(0,0,0,.2),0 1px 0 rgba(0,0,0,.95),0 2px 3px rgba(0,0,0,.7)}
.done{height:34px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:#a1a1a1}
.lbl{font-size:13px;font-weight:500}
.opt{height:40px;border:0;border-radius:7px;background:transparent;color:#a1a1a1;font:500 13px/1 'Geist',sans-serif;display:flex;align-items:center;justify-content:center;gap:6px}
.opt svg{flex-shrink:0;display:block}
.field{height:48px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid #262626;border-radius:12px}
.money input{flex-grow:1;min-width:0;border:0;background:transparent;outline:none;color:#ededed;font:15px 'Geist Mono',monospace}
.money input::placeholder{color:#8a8a8a;font-family:'Geist',sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #000000; overflow: hidden">
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.6)"></div>
  <div role="dialog" aria-label="New AI" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 796px; background: #0a0a0a; border-top: 1px solid #1f1f1f; border-radius: 16px 16px 0 0; display: flex; flex-direction: column">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; margin-top: 8px; border-radius: 2px; background: #333333"></span>
    <div style="padding: 10px 16px 0 16px; display: flex; align-items: center; gap: 12px">
      <button type="button" aria-label="Back" class="key-icon" style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 12px; display: flex; align-items: center; justify-content: center">

      </button>
      <h2 style="margin: 0; flex-grow: 1; font-size: 17px; font-weight: 600; letter-spacing: -0.02em">New AI</h2>
      <button type="button" aria-label="Close" class="key-icon" style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 12px; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div class="well" style="margin: 14px 16px 0 16px; padding: 3px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; border: 1px solid #1a1a1a; border-radius: 10px">
      <span class="done"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>DeepSeek</span>
      <span class="done"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Key</span>
      <span class="done"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>V4 Flash</span>
      <span class="seg-on" style="height: 34px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500">Setup</span>
    </div>
    <div style="padding: 20px 16px 20px 16px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span class="lbl">Computer</span>
        <div role="radiogroup" aria-label="Computer" class="well" style="padding: 3px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; border: 1px solid #1a1a1a; border-radius: 10px">
          <button type="button" role="radio" aria-checked="false" class="opt">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.4 7.4a8 8 0 1 0 11.2 0"></path></svg>Off</button>
          <button type="button" role="radio" aria-checked="false" class="opt">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4.5 4.5 0 0 1-.5 9.5z"></path></svg>Zilar</button>
          <button type="button" role="radio" aria-checked="false" class="opt">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="1.5"></rect><rect x="4" y="13" width="16" height="7" rx="1.5"></rect><path d="M8 7.5h.01M8 16.5h.01"></path></svg>Machine</button>
          <button type="button" role="radio" aria-checked="true" class="opt sel">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l1.8 4.7L18.5 10.5l-4.7 1.8L12 17l-1.8-4.7L5.5 10.5l4.7-1.8z"></path></svg>Auto</button>
        </div>
        <button type="button" aria-haspopup="listbox" aria-label="Machine" class="well field" style="color: #ededed; font: 15px 'Geist', sans-serif; text-align: left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="1.5"></rect><rect x="4" y="13" width="16" height="7" rx="1.5"></rect><path d="M8 7.5h.01M8 16.5h.01"></path></svg>
          <span style="flex-grow: 1">hetzner-vps</span>
          <span role="img" aria-label="Online" style="width: 8px; height: 8px; border-radius: 999px; background: #22c55e"></span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="ps-day" class="lbl">Per day</label>
          <div class="well field money"><span class="mono" style="font-size: 15px; color: #8a8a8a">$</span><input id="ps-day" type="text" inputmode="decimal" value="0.50"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="ps-month" class="lbl">Per month</label>
          <div class="well field money"><span class="mono" style="font-size: 15px; color: #8a8a8a">$</span><input id="ps-month" type="text" inputmode="decimal" placeholder="No limit"></div>
        </div>
      </div>
    </div>
    <div style="padding: 12px 16px 34px 16px; border-top: 1px solid #1f1f1f">
      <button type="button" class="key-primary" style="width: 100%; height: 48px; border: 0; border-radius: 12px; font: 600 15px 'Geist', sans-serif">Create AI</button>
    </div>
  </div>
</div>
