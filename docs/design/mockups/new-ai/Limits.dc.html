<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New AI, setup step</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Geist',system-ui,sans-serif;color:#ededed}
a{color:#ededed}a:hover{color:#ffffff}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.key-primary{background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.08) 48%,rgba(0,0,0,0) 52%,rgba(0,0,0,.14)),#ededed;color:#0a0a0a;text-shadow:0 1px 0 rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 0 rgba(0,0,0,.2),inset 0 0 0 1px rgba(255,255,255,.12),0 1px 0 rgba(0,0,0,.95),0 2px 3px rgba(0,0,0,.7),0 10px 18px -8px rgba(0,0,0,.95)}
.key-icon{background:linear-gradient(180deg,#2c2c2c,#151515);border:1px solid #050505;color:#d4d4d4;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.65),0 1px 0 rgba(0,0,0,.95),0 3px 6px -1px rgba(0,0,0,.75)}
.key-icon svg{filter:drop-shadow(0 1px 0 rgba(0,0,0,.95))}
.well{background:#0c0c0c;box-shadow:inset 0 2px 6px rgba(0,0,0,.9),inset 0 1px 1px rgba(0,0,0,.8),inset 0 0 0 1px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.06)}
.seg-on{background:linear-gradient(180deg,#333333,#1c1c1c);color:#ededed;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.6),0 1px 0 rgba(0,0,0,.9),0 2px 4px rgba(0,0,0,.7);text-shadow:0 -1px 0 rgba(0,0,0,.7)}
.done{height:28px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;color:#a1a1a1}
.lbl{font-size:13px;font-weight:500}
.sel{background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.08) 48%,rgba(0,0,0,0) 52%,rgba(0,0,0,.14)),#ededed !important;color:#0a0a0a !important;text-shadow:0 1px 0 rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 0 rgba(0,0,0,.2),0 1px 0 rgba(0,0,0,.95),0 2px 3px rgba(0,0,0,.7)}
.opt{height:34px;border:0;border-radius:7px;background:transparent;color:#a1a1a1;font:500 13px/1 'Geist',sans-serif;display:flex;align-items:center;justify-content:center;gap:7px}
.opt svg{flex-shrink:0;display:block}
.field{height:40px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid #262626;border-radius:10px}
.money input{flex-grow:1;min-width:0;border:0;background:transparent;outline:none;color:#ededed;font:14px 'Geist Mono',monospace}
.money input::placeholder{color:#8a8a8a;font-family:'Geist',sans-serif}
</style>
</helmet>
<div style="width: 960px; height: 760px; position: relative; box-sizing: border-box; padding: 12px; display: flex; gap: 12px; background: #000000; overflow: hidden">
  <div style="width: 300px; background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 16px"></div>
  <div style="flex-grow: 1; background-color: #0a0a0a; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 22px 22px; border: 1px solid #1f1f1f; border-radius: 16px"></div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center">
    <div role="dialog" aria-label="New AI" style="width: 480px; background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,0.8); display: flex; flex-direction: column">
      <div style="padding: 16px 16px 0 20px; display: flex; align-items: center">
        <h2 style="margin: 0; flex-grow: 1; font-size: 18px; font-weight: 600; letter-spacing: -0.02em">New AI</h2>
        <button type="button" aria-label="Close" class="key-icon" style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 10px; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <div class="well" style="margin: 16px 20px 0 20px; padding: 3px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; border: 1px solid #1a1a1a; border-radius: 10px">
        <span class="done"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>DeepSeek</span>
        <span class="done"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Key</span>
        <span class="done"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>V4 Flash</span>
        <span class="seg-on" style="height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500">Setup</span>
      </div>
      <div style="padding: 20px; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span class="lbl">Computer</span>
          <div role="radiogroup" aria-label="Computer" class="well" style="padding: 3px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; border: 1px solid #1a1a1a; border-radius: 10px">
            <button type="button" role="radio" aria-checked="false" class="opt">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.4 7.4a8 8 0 1 0 11.2 0"></path></svg>Off</button>
            <button type="button" role="radio" aria-checked="false" class="opt">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4.5 4.5 0 0 1-.5 9.5z"></path></svg>Zilar</button>
            <button type="button" role="radio" aria-checked="false" class="opt">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="1.5"></rect><rect x="4" y="13" width="16" height="7" rx="1.5"></rect><path d="M8 7.5h.01M8 16.5h.01"></path></svg>Machine</button>
            <button type="button" role="radio" aria-checked="true" class="opt sel">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l1.8 4.7L18.5 10.5l-4.7 1.8L12 17l-1.8-4.7L5.5 10.5l4.7-1.8z"></path></svg>Auto</button>
          </div>
          <button type="button" aria-haspopup="listbox" aria-label="Machine" class="well field" style="color: #ededed; font: 14px 'Geist', sans-serif; text-align: left">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="1.5"></rect><rect x="4" y="13" width="16" height="7" rx="1.5"></rect><path d="M8 7.5h.01M8 16.5h.01"></path></svg>
            <span style="flex-grow: 1">hetzner-vps</span>
            <span role="img" aria-label="Online" style="width: 8px; height: 8px; border-radius: 999px; background: #22c55e"></span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="l-day" class="lbl">Per day</label>
            <div class="well field money"><span class="mono" style="font-size: 14px; color: #8a8a8a">$</span><input id="l-day" type="text" inputmode="decimal" value="0.50"></div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="l-month" class="lbl">Per month</label>
            <div class="well field money"><span class="mono" style="font-size: 14px; color: #8a8a8a">$</span><input id="l-month" type="text" inputmode="decimal" placeholder="No limit"></div>
          </div>
        </div>
      </div>
      <div style="padding: 14px 20px; border-top: 1px solid #1f1f1f; display: flex; justify-content: flex-end; gap: 8px">
        <button type="button" class="key-icon" style="height: 36px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; font: 600 14px 'Geist', sans-serif">Back</button>
        <button type="button" class="key-primary" style="height: 36px; padding: 0 16px; border: 0; border-radius: 10px; font: 600 14px 'Geist', sans-serif">Create AI</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
