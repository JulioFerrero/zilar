<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI work states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Geist',system-ui,sans-serif;color:#ededed}
a{color:#ededed}a:hover{color:#ffffff}
.cell{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.label{font-size:14px;font-weight:500}
.how{font-size:12px;color:#a1a1a1;line-height:17px;max-width:150px}
.orb{position:relative;width:36px;height:36px;border-radius:999px;background:radial-gradient(circle at 35% 30%,#c4b5fd,#4338ca 55%,#1e1b4b)}
</style>
</helmet>
<div style="width: 680px; height: 280px; box-sizing: border-box; background: #0a0a0a; padding: 36px 32px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
  <div class="cell">
    <span class="orb" role="img" aria-label="Working"><svg width="46" height="46" viewBox="0 0 46 46" fill="none" aria-hidden="true" style="position: absolute; left: -5px; top: -5px"><circle cx="23" cy="23" r="21" stroke="#ededed" stroke-width="2" stroke-linecap="round" stroke-dasharray="90 42"></circle></svg></span>
    <span class="label">Working</span>
    <span class="how">A turning ring while the AI runs a task. Stop is one tap away.</span>
  </div>
  <div class="cell">
    <span class="orb" role="img" aria-label="Waiting for you"><span style="position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 999px; background: #f59e0b; box-shadow: 0 0 0 2px #0a0a0a"></span></span>
    <span class="label">Waiting for you</span>
    <span class="how">An amber dot when it asked a question or needs an approval.</span>
  </div>
  <div class="cell">
    <svg width="36" height="36" viewBox="0 0 16 16" fill="none" role="img" aria-label="Done"><circle cx="8" cy="8" r="7" fill="#22c55e"></circle><path d="M4.9 8.3l2.1 2.1 4.1-4.5" stroke="#0a0a0a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span class="label">Done</span>
    <span class="how">The AI finished, or you marked the topic done.</span>
  </div>
  <div class="cell">
    <span class="orb" role="img" aria-label="Idle"></span>
    <span class="label">Idle</span>
    <span class="how">Nothing extra. A plain topic shows no mark at all.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":680,"height":280}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
