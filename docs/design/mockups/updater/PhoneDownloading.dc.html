<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Downloading update, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Geist',system-ui,sans-serif;color:#ededed}
a{color:#ededed}a:hover{color:#ffffff}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.key-icon{background:linear-gradient(180deg,#2c2c2c,#151515);border:1px solid #050505;color:#d4d4d4;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.65),0 1px 0 rgba(0,0,0,.95),0 3px 6px -1px rgba(0,0,0,.75)}
.ghost{background:transparent;color:#ededed;border:0;border-radius:8px;height:36px;padding:0 12px;font:500 14px 'Geist',system-ui,sans-serif;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px}
.orb{width:52px;height:52px;border-radius:999px;flex-shrink:0}
.name{font-size:16px;font-weight:500}
.preview{font-size:14px;color:#a1a1a1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:12px;color:#8a8a8a}
.tile{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.well{height:8px;border-radius:999px;background:#0c0c0c;border:1px solid #1a1a1a;box-shadow:inset 0 2px 6px rgba(0,0,0,.9),inset 0 1px 1px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.06);overflow:hidden}
.fill{height:100%;border-radius:999px;background:linear-gradient(180deg,#ffffff,#cfcfcf)}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0a0a0a; position: relative; overflow: hidden">
  <header style="height: 64px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #1f1f1f">
    <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">Chats</h1>
  </header>
  <div style="display: flex; flex-direction: column; padding-top: 8px">
    <div class="row">
      <span class="orb" aria-hidden="true" style="background: radial-gradient(circle at 35% 30%, #c4b5fd, #4338ca 55%, #1e1b4b)"></span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <span class="name">ai test</span>
        <span class="preview">Deepseek: Prices updated</span>
      </div>
      <span class="time">13:04</span>
    </div>
    <div class="row">
      <span class="orb" aria-hidden="true" style="background: radial-gradient(circle at 35% 30%, #a7f3d0, #047857 55%, #022c22)"></span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <span class="name">Deepseek</span>
        <span class="preview">Done. The routine runs every minute.</span>
      </div>
      <span class="time">12:58</span>
    </div>
    <div class="row">
      <span class="orb" aria-hidden="true" style="background: radial-gradient(circle at 35% 30%, #fef9c3, #a16207 55%, #3f2a05)"></span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <span class="name">Zilar Updates</span>
        <span class="preview">v0.2.3 is out</span>
      </div>
      <span class="time">12:35</span>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 24px">
    <section role="dialog" aria-label="Downloading update" style="width: 320px; box-sizing: border-box; background: #111111; border: 1px solid #262626; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span class="tile key-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg>
        </span>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <h2 style="margin: 0; font-size: 16px; font-weight: 600">Downloading 0.2.4</h2>
          <span class="mono" style="font-size: 12px; color: #8a8a8a">41 of 67 MB</span>
        </div>
      </div>
      <div class="well" role="progressbar" aria-label="Download progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62">
        <div class="fill" style="width: 62%"></div>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px">
        <button type="button" class="ghost">Cancel</button>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
