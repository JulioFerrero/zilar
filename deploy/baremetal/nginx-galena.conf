# nginx alternative for a bare-metal Galena install (either this or the
# Caddyfile — pick one proxy, not both).
#
# Needs the nginx stream of certbot/ACME handled outside this file
# (certbot --nginx, or your own certificates), because unlike Caddy nginx
# does not issue certificates itself. Replace chat.example.com with your
# domain, and point ssl_certificate/ssl_certificate_key at your real
# certificate files. The three backends run on this same machine: static
# files from /srv/galena-web (the Vite build output), the server on
# 127.0.0.1:3000, ejabberd on 127.0.0.1:5280. NOT validated with real
# traffic (see guide §9: syntax-checked only, on this machine `nginx -t`
# was unavailable).
#
# WebSocket upgrades need the Upgrade/Connection headers on every
# proxied location (the chat WebSocket runs through /xmpp-ws/ws).

upstream galena_server {
  server 127.0.0.1:3000;
}

upstream galena_ejabberd {
  server 127.0.0.1:5280;
}

# Plain HTTP: ACME http-01 challenges and the redirect to HTTPS.
server {
  listen 80;
  listen [::]:80;
  server_name chat.example.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name chat.example.com;

  ssl_certificate /etc/letsencrypt/live/chat.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /srv/galena-web;
  index index.html;

  # Same security headers as the Docker image (apps/web/Caddyfile):
  # same-origin API, the XMPP WebSocket, images/uploads; no framing.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' wss: ws:; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Web app: hashed assets cache for a year, the entry point never.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # Server API (same-origin for the web app; cookies stay first-party).
  location /api/ {
    proxy_pass http://galena_server;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Server health, for monitors and the install test.
  location = /health {
    proxy_pass http://galena_server;
    proxy_set_header Host $host;
  }

  # XMPP over WebSocket (RFC 7395). The /xmpp-ws prefix is stripped so
  # ejabberd sees the /ws path its request_handlers expect.
  location /xmpp-ws/ {
    rewrite ^/xmpp-ws/(.*)$ /$1 break;
    proxy_pass http://galena_ejabberd;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # File uploads (XEP-0363). No rewrite here: ejabberd registers the
  # handler at /upload and hands out slot URLs of the form
  # https://<domain>/upload/<slot>/<file>, so the path arrives intact.
  location /upload/ {
    proxy_pass http://galena_ejabberd;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 50m;
  }

  # SPA fallback: every non-file path serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
