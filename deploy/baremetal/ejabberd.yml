###
### Zilar bare-metal ejabberd configuration.
###
### Installed at /etc/ejabberd/ejabberd.yml (see docs/INSTALL_BARE_METAL.md).
### Derived from deploy/ejabberd/ejabberd.yml (the production Docker config);
### unlike the container, a local install has no entrypoint filling macros
### from the environment, so every value below is written out literally —
### replace chat.example.com with your domain and the passwords/JWT secret
### with your own. Docs: https://docs.ejabberd.im/admin/configuration/
###

define_macro:
  HOST: chat.example.com
  MUC_HOST: rooms.chat.example.com
  # The admin account the Zilar server logs in as for the admin API
  # (EJABBERD_ADMIN_JID in /etc/zilar/zilar.env). Register it after the
  # first start: ejabberdctl register admin chat.example.com <password>.
  ADMIN: admin@chat.example.com
  SQL_SERVER: localhost
  SQL_DATABASE: ejabberd
  SQL_USERNAME: ejabberd
  # The ejabberd_password from setup-postgres.sql, written out literally.
  SQL_PASSWORD: CHANGE_ME
  # Public base URL for file uploads (XEP-0363 put_url): the slot URLs
  # clients get, through the reverse proxy below.
  UPLOAD_URL: 'https://chat.example.com/upload'
  PORT_C2S: 5222
  PORT_HTTP: 5280
  STARTTLS_REQUIRED: false

hosts:
  - HOST

loglevel: info

### like the container: the distribution package generates (or can be told
### to use) a CA-signed or self-signed certificate (see the guide §4). The
### container omits certfiles because TLS terminates at Caddy inside the
### container network — not applicable here.
certfiles:
  - /etc/ejabberd/server.pem

## Storage: everything goes to Postgres (database "ejabberd", created by
## deploy/baremetal/setup-postgres.sql). update_sql_schema lets ejabberd
## create or update its tables on start.
default_db: sql
sql_type: pgsql
sql_server: SQL_SERVER
sql_database: SQL_DATABASE
sql_username: SQL_USERNAME
sql_password: SQL_PASSWORD
update_sql_schema: true

## Federation off: no s2s listener below and every s2s connection is denied.
s2s_access: s2s

### Authentication. Our server creates XMPP accounts and issues short-lived
### HS256 JWTs; clients send the token as their SASL PLAIN password. `jwt` is
### listed first and `jwt_auth_only_rule` restricts every non-admin account to
### JWT, so a stored account password can never be used to log in. `sql` stays
### only for the admin account (used by /api basic auth). jwt_key points at a
### JWK file you write once (see the guide §4): derive it from the same
### ZILAR_XMPP_JWT_SECRET as the server with the recipe from
### deploy/ejabberd/jwt-entrypoint.sh (base64url of the raw secret bytes):
###
###   printf '%s' "$ZILAR_XMPP_JWT_SECRET" | base64 | tr -d '\n' | tr '+/' '-_' | tr -d '='
###   → {"kty":"oct","k":"<that>","alg":"HS256","use":"sig"} in /etc/ejabberd/jwt.jwk (mode 0600).
auth_method: [jwt, sql]
jwt_key: /etc/ejabberd/jwt.jwk
jwt_auth_only_rule: jwt_only

listen:
  # All three listeners bind loopback only: the reverse proxy and the
  # Zilar server on this same machine are the only clients (federation is
  # off, and C2S goes through the proxy's /xmpp-ws route). Nothing about
  # ejabberd is reachable from the network.
  - port: PORT_C2S
    ip: '127.0.0.1'
    module: ejabberd_c2s
    max_stanza_size: 262144
    shaper: c2s_shaper
    access: c2s
    starttls_required: STARTTLS_REQUIRED
  - # No s2s listener on 5269: federation is off.
    port: PORT_HTTP
    ip: '127.0.0.1'
    module: ejabberd_http
    request_handlers:
      /ws: ejabberd_http_ws
      /upload: mod_http_upload
      /api: mod_http_api
  # Push component listener for a local install (XEP-0114): the server on
  # this same machine dials port 5347 and receives the XEP-0357 publish IQs.
  # ejabberd does not expand macros in map keys, so the host below is
  # written out literally — it must equal PUSH_COMPONENT_JID in
  # /etc/zilar/zilar.env (push.<your domain>). The secret is the push
  # component password, also literal here (there is no entrypoint filling
  # macros on bare metal): edit both values by hand when you copy this
  # file. Loopback only: nothing else needs this listener.
  # (The Docker stack generates the same host at container start from
  # ZILAR_DOMAIN — see deploy/ejabberd/push-entrypoint.sh.)
  - port: 5347
    ip: '127.0.0.1'
    module: ejabberd_service
    hosts:
      push.chat.example.com:
        password: CHANGE_ME_PUSH_COMPONENT_SECRET

acl:
  local:
    user_regexp: ''
  # A local install reaches ejabberd from this same machine only (the
  # reverse proxy and the server on loopback), so the loopback ACL from
  # the dev config applies again — unlike the container, whose peers are
  # on the Compose network.
  loopback:
    ip:
      - 127.0.0.0/8
      - ::1/128
  admin:
    user:
      - ADMIN

access_rules:
  local:
    allow: local
  # Accounts that must use JWT only: every account except the admin, which
  # keeps SQL password auth for the /api basic auth. Referenced by
  # jwt_auth_only_rule above.
  jwt_only:
    deny: admin
    allow: all
  c2s:
    deny: blocked
    allow: all
  muc_create:
    # Only the admin (server) account creates rooms (T-0002 follow-up 4).
    allow: admin
  configure:
    allow: admin
  announce:
    allow: admin
  trusted_network:
    allow: loopback
  s2s:
    deny: all

api_permissions:
  'console commands':
    from: ejabberd_ctl
    who: all
    what: '*'
  'http api':
    # /api requires admin authentication. Only the loopback interface and
    # the local proxy reach this listener, and the proxy exposes no /api
    # route to the internet (Caddy/nginx below route it to the server only).
    from: mod_http_api
    who:
      access:
        allow:
          - acl: admin
    what:
      - '*'
      - '!stop'
      - '!start'

shaper:
  normal:
    rate: 3000
    burst_size: 20000
  fast: 100000

shaper_rules:
  max_user_sessions: 10
  max_user_offline_messages:
    5000: admin
    100: all
  # Upload quotas (T-0151): MiB each user may hold under the upload docroot.
  # Past the hard quota ejabberd deletes the user's oldest files down to
  # the soft quota; past the soft quota nothing is deleted yet. Same
  # 2048/4096 defaults as the Docker config; edit the numbers to retune.
  soft_upload_quota:
    2048: all
  hard_upload_quota:
    4096: all
  c2s_shaper:
    none: admin
    normal: all
  s2s_shaper: fast

modules:
  # Group chats on the MUC host: persistent and members-only by default,
  # with MAM enabled.
  mod_muc:
    hosts:
      - MUC_HOST
    db_type: sql
    access:
      - allow
    access_admin:
      - allow: admin
    access_create: muc_create
    access_persistent: muc_create
    access_mam:
      - allow
    default_room_options:
      members_only: true
      persistent: true
      mam: true
      # Non-anonymous: every occupant sees members' real JIDs, so clients can
      # show who sent each message (Zilar groups are between known contacts).
      anonymous: false
  # MUC room management commands (create_room_with_opts, set_room_affiliation,
  # get_room_affiliations, destroy_room) used through /api.
  mod_muc_admin: {}
  # History in the database, on by default for every chat.
  mod_mam:
    db_type: sql
    default: always
    assume_mam_usage: true
  # Push notifications: mod_push routes offline and MAM events to our
  # XEP-0114 component (see the listener above). `include_sender` and
  # `include_body` stay off: the component resolves who and what itself from
  # the chat archive, honouring mute, visibility and the previews setting —
  # ejabberd never sees message text for push. `mod_push_keepalive` keeps
  # the stream-management session up so hibernating sessions still notify.
  mod_push:
    include_sender: false
    include_body: false
  mod_push_keepalive: {}
  mod_http_upload:
    max_size: 52428800
    # Outside Docker there is no /opt/ejabberd volume: uploads live in a
    # plain directory owned by the ejabberd user (create it, see the guide
    # §3). Back up this exact directory — nothing else holds the files.
    docroot: /var/lib/ejabberd/upload
    put_url: UPLOAD_URL
    custom_headers:
      'Access-Control-Allow-Origin': '*'
      'Access-Control-Allow-Methods': 'GET,HEAD,PUT,OPTIONS'
      'Access-Control-Allow-Headers': 'Content-Type'
  # Upload quotas (T-0151): stock module, always on — same layout as the
  # Docker config (deploy/ejabberd/ejabberd.yml): 2048 MiB soft / 4096 MiB
  # hard per user, oldest files trimmed first past the hard quota, no
  # age-out (`max_days` unset). To change the numbers, edit the two shaper
  # rules below (shaper keys are literal, never macros — verified live).
  mod_http_upload_quota: {}
  mod_stream_mgmt:
    resend_on_timeout: if_offline
  mod_carboncopy: {}
  mod_ping: {}
  mod_http_api: {}
  mod_admin_extra: {}
  mod_adhoc: {}
  mod_blocking: {}
  mod_caps: {}
  mod_disco: {}
  mod_last: {}
  mod_offline:
    access_max_user_messages: max_user_offline_messages
  mod_privacy: {}
  mod_private: {}
  mod_roster:
    versioning: true
  mod_vcard: {}
  # No mod_register: in-band registration is disabled. Accounts are created
  # through the admin API (T-0003).
