# Zilar core: the stateful half of the split stack, as a Coolify **Service**
# (Docker Compose, published ghcr.io images, no build).
#
# Target layout (docs/deploy/zero-downtime-plan.md Phase 2, and
# deploy/coolify/LAYOUT.md): Zilar runs as three Coolify resources so that a
# server or web push is a rolling update instead of a whole-stack recreate:
#   - zilar-core   (this file): postgres, ejabberd, desk-agent and desk-egress.
#                  It owns the data volumes and routes /xmpp-ws and /upload to
#                  ejabberd so a web deploy never cuts chat sockets.
#   - zilar-server a Docker-image Application (ghcr.io/.../zilar-server).
#   - zilar-web    a Docker-image Application (ghcr.io/.../zilar-web).
# LAYOUT.md is the source for every variable, domain, volume and health check
# of the three resources. Nothing here touches live: it is the definition the
# installer (docs/deploy/one-line-install-plan.md step 3) creates and the
# cutover (plan step 8) follows.
#
# Differences from deploy/coolify/docker-compose.app.yml (the one built from
# git), besides `image:` replacing `build:`:
# - every secret is a **plain variable** the installer generates once and sets
#   on zilar-server as well; no SERVICE_PASSWORD_* magic variables, so the two
#   sides can never disagree on a secret;
# - the public host is the plain variable ZILAR_DOMAIN, not SERVICE_FQDN_WEB;
# - only the stateful services live here; `server` and `web` moved to their own
#   Applications (see LAYOUT.md);
# - the sticker-data and avatar-data volumes are gone: they are the
#   zilar-server App's own persistent storages now, and desk-socket is an
#   external volume naming that App's storage (see the volumes block);
# Everything else (environment, volumes, health checks, networks) is copied
# from that file unchanged.
#
# Coolify conventions used (https://coolify.io/docs/services/configuration/docker-compose):
# - `${VAR:-default}` supplies a fallback.
# - the public routes are explicit Traefik labels on ejabberd rather than a
#   `SERVICE_URL_*` variable: a Service applies one strip-prefix flag per
#   component, not per path, and /xmpp-ws/ws and /upload/ need opposite ones.
# - Components in one stack reach each other by Compose service name; from
#   another resource use `<service>-<this resource uuid>` (LAYOUT.md).
# - Health checks live in Compose (Services have no separate health-check UI).

services:
  postgres:
    image: ghcr.io/${IMAGE_OWNER:-julioferrero}/zilar-postgres:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      ZILAR_DB_PASSWORD: ${ZILAR_DB_PASSWORD}
      EJABBERD_DB_PASSWORD: ${EJABBERD_DB_PASSWORD}
      ZILAR_ARCHIVE_DB_PASSWORD: ${ARCHIVE_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      start_interval: 1s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  ejabberd:
    # Production config (ejabberd.yml + jwt-entrypoint.sh) is baked into the
    # image; hosts, passwords, the upload URL and the JWT secret arrive as
    # environment below.
    image: ghcr.io/${IMAGE_OWNER:-julioferrero}/zilar-ejabberd:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    command: ['foreground']
    environment:
      # Traefik terminates TLS; ejabberd serves plain HTTP on the Service
      # network. The public host is the plain variable ZILAR_DOMAIN (the
      # installer sets the same host on zilar-server and zilar-web).
      EJABBERD_MACRO_HOST: ${ZILAR_DOMAIN}
      EJABBERD_MACRO_MUC_HOST: rooms.${ZILAR_DOMAIN}
      EJABBERD_MACRO_ADMIN: admin@${ZILAR_DOMAIN}
      # T-0167: read by our own entrypoint (baked into the image), which
      # registers the admin account with all output discarded. Never use the
      # base image's REGISTER_ADMIN_PASSWORD here: it echoes the
      # `ejabberdctl register ... <password>` command line into the log.
      EJABBERD_ADMIN_PASSWORD: ${EJABBERD_ADMIN_PASSWORD}
      EJABBERD_MACRO_SQL_PASSWORD: ${EJABBERD_DB_PASSWORD}
      # T-1939: the SQL host. ejabberd's config defaults SQL_SERVER to
      # `postgres`, but on Coolify's shared `coolify` network that name is an
      # alias of Coolify's own database (`coolify-db`), so the login fails and
      # ejabberd stays down. Set CORE_POSTGRES_HOST to `postgres-<core uuid>`
      # (the container name Coolify gives this Service's postgres component);
      # the fallback only fits a plain local compose run.
      EJABBERD_MACRO_SQL_SERVER: ${CORE_POSTGRES_HOST:-postgres}
      # Push component (T-0145, XEP-0114): the secret the server's component
      # authenticates with. Must equal zilar-server's PUSH_COMPONENT_SECRET.
      EJABBERD_MACRO_PUSH_COMPONENT_SECRET: ${PUSH_COMPONENT_SECRET}
      # push.<XMPP domain> is derived at container start from ZILAR_DOMAIN
      # (see deploy/ejabberd/push-entrypoint.sh): set it to the same value as
      # the server's XMPP_DOMAIN so the entrypoint writes push.<XMPP_DOMAIN>,
      # matching the server's PUSH_COMPONENT_JID.
      ZILAR_DOMAIN: ${ZILAR_DOMAIN}
      ZILAR_XMPP_JWT_SECRET: ${XMPP_JWT_SECRET}
      EJABBERD_MACRO_UPLOAD_URL: https://${ZILAR_DOMAIN}/upload
      # T-1584/T-1939: the public paths Traefik sends straight to ejabberd.
      # Routing is explicit in the `labels` below, not a SERVICE_URL_* magic
      # variable: Coolify applies one strip-prefix flag per component and not
      # per path, so /xmpp-ws/ws (which must arrive as /ws) and /upload/
      # (which must arrive unchanged) cannot share one SERVICE_URL_* value.
    expose:
      - '5280'
    labels:
      # The WebSocket: ejabberd answers it at /ws (request_handlers in
      # deploy/ejabberd/ejabberd.yml), so only the exact path /xmpp-ws/ws is
      # routed and only it is stripped. A prefix route would expose
      # /xmpp-ws/api/... as ejabberd's admin API (/api on the same listener).
      traefik.enable: 'true'
      traefik.docker.network: coolify
      traefik.http.services.zilar-ejabberd.loadbalancer.server.port: '5280'
      traefik.http.middlewares.zilar-xmpp-strip.stripprefix.prefixes: /xmpp-ws
      traefik.http.routers.zilar-xmpp-ws.rule: Host(`${ZILAR_DOMAIN}`) && Path(`/xmpp-ws/ws`)
      traefik.http.routers.zilar-xmpp-ws.entrypoints: https
      traefik.http.routers.zilar-xmpp-ws.tls: 'true'
      traefik.http.routers.zilar-xmpp-ws.tls.certresolver: letsencrypt
      traefik.http.routers.zilar-xmpp-ws.middlewares: zilar-xmpp-strip
      # Uploads: mod_http_upload serves /upload/... as written, so this router
      # has no stripprefix middleware.
      traefik.http.routers.zilar-upload.rule: Host(`${ZILAR_DOMAIN}`) && PathPrefix(`/upload/`)
      traefik.http.routers.zilar-upload.entrypoints: https
      traefik.http.routers.zilar-upload.tls: 'true'
      traefik.http.routers.zilar-upload.tls.certresolver: letsencrypt
      # Plain http on both paths redirects to https instead of reaching
      # ejabberd unencrypted.
      traefik.http.middlewares.zilar-https-redirect.redirectscheme.scheme: https
      traefik.http.routers.zilar-xmpp-ws-http.rule: Host(`${ZILAR_DOMAIN}`) && Path(`/xmpp-ws/ws`)
      traefik.http.routers.zilar-xmpp-ws-http.entrypoints: http
      traefik.http.routers.zilar-xmpp-ws-http.middlewares: zilar-https-redirect
      traefik.http.routers.zilar-upload-http.rule: Host(`${ZILAR_DOMAIN}`) && PathPrefix(`/upload/`)
      traefik.http.routers.zilar-upload-http.entrypoints: http
      traefik.http.routers.zilar-upload-http.middlewares: zilar-https-redirect
    volumes:
      - ejabberd-database:/opt/ejabberd/database
      - ejabberd-uploads:/opt/ejabberd/upload
    healthcheck:
      test: ['CMD', 'ejabberdctl', 'status']
      interval: 10s
      start_interval: 1s
      timeout: 10s
      retries: 30
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # --- AI computers (desks) -----------------------------------------------
  # A Coolify Service does not run ./zilar: run the host setup command once on
  # the host and these services turn computers on within about a minute, with
  # nothing to set here. desk-agent is the only service with the Docker
  # socket; desk-egress is a jail's only way to the web. The host prep Compose
  # cannot do (gVisor, the shared memory-pool slice) is
  # `curl -fsSL https://get.zilar.app | sudo sh -s -- --desks-host`. Both
  # images come from the published zilar-desk-agent tag (T-1582).
  desk-agent:
    image: ghcr.io/${IMAGE_OWNER:-julioferrero}/zilar-desk-agent:${IMAGE_TAG:-latest}
    restart: unless-stopped
    user: '0:0'
    privileged: true
    # One image, two entry points: this service is the sidecar (desk-egress
    # picks the proxy below).
    command: ['node', '/app/desk-agent']
    environment:
      DESK_RUNTIME: ${DESK_RUNTIME:-runsc}
      DESK_NETWORK: desk-net
      DESK_CGROUP_PARENT: zilar-desks.slice
      DESK_MAX_RUNNING: ${DESK_MAX_RUNNING:-12}
      DESK_IMAGE_OWNER: ${IMAGE_OWNER:-julioferrero}
      DESK_IMAGE_TAG: ${IMAGE_TAG:-latest}
      DESK_IMAGE: ${DESK_IMAGE:-}
      DESK_WORKSPACE_ROOT: /var/lib/zilar/desks
      DESK_WORKSPACE_MODE: image
      DESK_AGENT_SOCKET: /run/zilar/desk.sock
      DESK_EGRESS_PROXY: http://desk-egress:3128
      DESK_EGRESS_REGISTRY: /run/zilar-egress/desk-egress.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The agent loop-mounts each AI's disk here; rshared lets the host (and the jail's bind mount) see it.
      - /var/lib/zilar/desks:/var/lib/zilar/desks:rshared
      - /dev:/dev
      - desk-socket:/run/zilar
      - desk-egress-socket:/run/zilar-egress
    healthcheck:
      test: ['CMD-SHELL', 'test -S /run/zilar/desk.sock']
      interval: 15s
      start_interval: 2s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  desk-egress:
    image: ghcr.io/${IMAGE_OWNER:-julioferrero}/zilar-desk-agent:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ['node', '/app/desk-egress']
    environment:
      DESK_EGRESS_PORT: '3128'
      DESK_EGRESS_REGISTRY: /run/zilar-egress/desk-egress.sock
    volumes:
      - desk-egress-socket:/run/zilar-egress
    networks:
      - desk-net
      - desk-out
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const s=require('node:net').connect(3128,'127.0.0.1');
          s.on('connect',()=>process.exit(0));
          s.on('error',()=>process.exit(1));
      interval: 15s
      start_interval: 2s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  # The jails' network: internal (no route out), and only desk-egress is on it
  # as the way off. A fixed name so the sidecar's `--network desk-net` finds it.
  desk-net:
    name: desk-net
    internal: true
  # desk-egress's own way out to the public web; no other desk container joins.
  desk-out:

volumes:
  postgres-data:
  ejabberd-database:
  ejabberd-uploads:
  # T-1939: sticker-data and avatar-data are not declared here any more. An
  # App cannot mount a Service's named volume: persistent storage belongs to
  # the App that uses it, so zilar-server owns both (`<app uuid>-<name>`) and
  # this Service never creates them.
  # The desk-agent unix socket, shared with zilar-server (DESK_AGENT_SOCKET).
  # T-1939: it is the zilar-server App's own storage volume, so it already
  # exists with the App's own name (`<server app uuid>-desk-socket`); declare
  # that name as external instead of letting Compose create a core-owned one.
  desk-socket:
    external: true
    name: ${SERVER_DESK_SOCKET_VOLUME:?SERVER_DESK_SOCKET_VOLUME is required}
  # The egress policy registry socket, shared by desk-agent and desk-egress.
  desk-egress-socket:
