# Zilar production stack built from git by a Coolify Application.
#
# This is the compose source of a Coolify **Application** (build pack "Docker
# Compose", source "GitHub App", Docker Compose Location
# /deploy/coolify/docker-compose.app.yml): Coolify checks out this repository
# and builds every service from the Dockerfiles below on each push, unlike
# deploy/coolify/docker-compose.yml (a Coolify Service that pulls prebuilt
# ghcr.io images). See docs/deploy/coolify-app-plan.md.
#
# Build contexts are relative to the repo root, because Coolify passes
# `--project-directory <repo root>`: the repo root is `.` and deploy/ is
# `deploy`. To check locally, run `docker compose --project-directory . -f
# deploy/coolify/docker-compose.app.yml config`. Coolify supplies the reverse proxy
# and HTTPS, so there is no `caddy` service here: every service exposes its
# internal port and Coolify routes a generated domain to it.
#
# Coolify conventions used (https://coolify.io/docs/services/configuration/docker-compose):
# - `${VAR:-default}` supplies a fallback. Do not put `:?` on SERVICE_* variables:
#   Coolify then leaves its generated values empty and docker refuses to start.
# - `SERVICE_URL_<SERVICE>_<PORT>` (with an optional path suffix) asks
#   Coolify to generate a domain for that Compose service on that internal
#   port; the same value is reused through the Service as a normal variable.
# - `SERVICE_PASSWORD_<ID>` asks Coolify to generate and persist a random
#   password, shared by every component that references the same name.
#   <ID> must have NO underscore: Coolify leaves `SERVICE_PASSWORD_A_B` empty.
# - Components in one stack reach each other by Compose service name; no
#   `ports:` are published because Coolify's Traefik proxy is the entry point.
# - Health checks live in Compose (Services have no separate health-check UI).
#
# Each service is built from the Dockerfile .github/workflows/images.yml also
# builds: apps/server and apps/web from the repo root (`.`), and
# deploy/postgres and deploy/ejabberd from deploy/ (`deploy`). The server build
# receives the commit as ZILAR_COMMIT, which /health reports; Coolify provides
# SOURCE_COMMIT when "Include source commit in build" is on. No repository
# files are mounted at runtime: each image bakes in its own config.
#
# One domain: Coolify routes the install's single domain to the `web` service, and the
# web container forwards /api to the server and /xmpp-ws and /upload to ejabberd
# (apps/web/Caddyfile). The XMPP domain is that same host, so there is nothing to
# configure besides the domain itself.

services:
  postgres:
    build:
      context: deploy
      dockerfile: postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: postgres
      ZILAR_DB_PASSWORD: ${SERVICE_PASSWORD_ZILARDB}
      EJABBERD_DB_PASSWORD: ${SERVICE_PASSWORD_EJABBERDDB}
      ZILAR_ARCHIVE_DB_PASSWORD: ${SERVICE_PASSWORD_ARCHIVEDB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      start_interval: 1s
      timeout: 5s
      retries: 12
      start_period: 10s

  ejabberd:
    # Production config (ejabberd.yml + jwt-entrypoint.sh) is baked into the
    # image by deploy/ejabberd/Dockerfile; hosts, passwords, the upload URL
    # and the JWT secret arrive as environment below.
    build:
      context: deploy
      dockerfile: ejabberd/Dockerfile
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    command: ['foreground']
    environment:
      # Traefik terminates TLS; ejabberd serves plain HTTP on the Service
      # network. HOST/MUC_HOST/ADMIN come from the public domain you set in
      # Coolify (SERVICE_FQDN roots), passed here as plain variables.
      EJABBERD_MACRO_HOST: ${SERVICE_FQDN_WEB}
      EJABBERD_MACRO_MUC_HOST: rooms.${SERVICE_FQDN_WEB}
      EJABBERD_MACRO_ADMIN: admin@${SERVICE_FQDN_WEB}
      # T-0167: read by our own entrypoint (baked into the image), which
      # registers the admin account with all output discarded. Never use the
      # base image's REGISTER_ADMIN_PASSWORD here: it echoes the
      # `ejabberdctl register ... <password>` command line into the log.
      EJABBERD_ADMIN_PASSWORD: ${SERVICE_PASSWORD_EJABBERDADMIN}
      EJABBERD_MACRO_SQL_PASSWORD: ${SERVICE_PASSWORD_EJABBERDDB}
      # Push component (T-0145, XEP-0114): the secret the server's component
      # authenticates with. Must equal the server's PUSH_COMPONENT_SECRET
      # below. No placeholder default: an unset
      # SERVICE_PASSWORD_PUSHCOMPONENT stays empty, the handshake fails and
      # push stays non-functional until a real password is generated (the
      # server also refuses the documented placeholder, so the two sides
      # can never agree on a known secret). On Coolify confirm
      # SERVICE_PASSWORD_PUSHCOMPONENT holds a generated value.
      EJABBERD_MACRO_PUSH_COMPONENT_SECRET: ${SERVICE_PASSWORD_PUSHCOMPONENT}
      # push.<XMPP domain> is derived at container start from ZILAR_DOMAIN
      # (see deploy/ejabberd/push-entrypoint.sh): set it to the same value
      # as XMPP_DOMAIN so the entrypoint writes push.<XMPP_DOMAIN>, matching
      # PUSH_COMPONENT_JID below.
      ZILAR_DOMAIN: ${SERVICE_FQDN_WEB}
      ZILAR_XMPP_JWT_SECRET: ${SERVICE_PASSWORD_XMPPJWT}
      EJABBERD_MACRO_UPLOAD_URL: https://${SERVICE_FQDN_WEB}/upload
    expose:
      - '5280'
    volumes:
      - ejabberd-database:/opt/ejabberd/database
      - ejabberd-uploads:/opt/ejabberd/upload
    healthcheck:
      test: ['CMD', 'ejabberdctl', 'status']
      interval: 10s
      start_interval: 1s
      timeout: 10s
      retries: 30
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        ZILAR_COMMIT: ${SOURCE_COMMIT:-unknown}
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      ejabberd:
        condition: service_healthy
    environment:
      # See deploy/docker-compose.yml: the mailer is picked at runtime.
      # Explicit SMTP variables below still win (unchanged behaviour); with
      # none of them set, mail comes from the first-run setup screen
      # (T-0161), which stores the Resend key encrypted — so there are no
      # mail secrets to fill in here and no terminal to touch.
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgres://zilar:${SERVICE_PASSWORD_ZILARDB}@postgres:5432/zilar
      XMPP_ARCHIVE_DATABASE_URL: postgres://zilar_archive:${SERVICE_PASSWORD_ARCHIVEDB}@postgres:5432/ejabberd
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_URL: ${SERVICE_URL_WEB}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_BETTERAUTH}
      # The API shares the web app's domain, so the allowed origin is that domain.
      WEB_ORIGINS: ${SERVICE_URL_WEB}
      # Client IP for the per-IP limiters (setup, join, invite preview):
      # Coolify's Traefik and the web Caddy above both append
      # X-Forwarded-For, so the client is the 2nd address from the right
      # (`clientIpFrom` in apps/server/src/http/client-ip.ts). With 0 every
      # visitor would share one proxy-address budget, lockable by anyone.
      TRUSTED_PROXY_HOPS: 2
      EJABBERD_API_URL: http://ejabberd:5280/api
      EJABBERD_ADMIN_JID: admin@${SERVICE_FQDN_WEB}
      EJABBERD_ADMIN_PASSWORD: ${SERVICE_PASSWORD_EJABBERDADMIN}
      XMPP_DOMAIN: ${SERVICE_FQDN_WEB}
      XMPP_MUC_DOMAIN: rooms.${SERVICE_FQDN_WEB}
      # The WS handler answers at ejabberd's /ws path, so the public token
      # URL is the routed WS domain plus /ws.
      XMPP_WS_PUBLIC_URL: wss://${SERVICE_FQDN_WEB}/xmpp-ws/ws
      ZILAR_XMPP_JWT_SECRET: ${SERVICE_PASSWORD_XMPPJWT}
      ZILAR_KEY_ENCRYPTION_KEY: ${SERVICE_PASSWORD_KEYENCRYPTION}
      # Where sticker files live: a persistent volume (see `volumes:` below),
      # fixed absolute path, always set — never relative, never empty.
      # A manual edit of this value orphans previously uploaded stickers.
      STICKER_STORAGE_DIR: /data/stickers
      # Where profile pictures live: a persistent volume (see `volumes:`
      # below), fixed absolute path, always set — never relative, never
      # empty. Same rules as the sticker dir.
      AVATAR_STORAGE_DIR: /data/avatars
      # Where chat background wallpapers live (T-0460): it reuses the existing
      # `avatar-data` volume mounted at /data/avatars, so no new volume is
      # needed. Same rules as the avatar dir: a manual edit orphans previously
      # uploaded wallpapers.
      BACKGROUND_STORAGE_DIR: /data/avatars/backgrounds
      AGENT_GATEWAY_ENABLED: ${AGENT_GATEWAY_ENABLED:-true}
      ACTION_DEMO_ENABLED: ${ACTION_DEMO_ENABLED:-false}
      RUNNER_HUB_ENABLED: ${RUNNER_HUB_ENABLED:-false}
      RUNNER_HUB_PORT: 3189
      # Outgoing email: sign-in codes are sent by email. The first-run
      # setup screen (T-0161) collects the Resend key in the browser and
      # stores it encrypted, so mail needs no variables here. The SMTP
      # overrides below stay for installs that prefer their own provider:
      # when any of them is set, it wins over the stored settings. Empty
      # means unset.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      # Same rule as deploy/docker-compose.yml: leave unfilled Coolify
      # variables unset and the server boots with push off (an empty value
      # fails startup, so delete the line instead of blanking it).
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-}
      # push.<XMPP domain>: must equal the host the entrypoint writes into
      # the ejabberd_service listener from the XMPP_DOMAIN below (see
      # deploy/ejabberd/push-entrypoint.sh). Set ZILAR_DOMAIN to the same
      # value as XMPP_DOMAIN so the entrypoint derives it.
      PUSH_COMPONENT_JID: push.${SERVICE_FQDN_WEB}
      # Must equal ejabberd's EJABBERD_MACRO_PUSH_COMPONENT_SECRET above.
      # No placeholder default (see above): unset stays empty and the
      # server boots with push off.
      PUSH_COMPONENT_SECRET: ${SERVICE_PASSWORD_PUSHCOMPONENT}
      # Host of ejabberd's XEP-0114 component listener (T-0172): the Compose
      # service name, not 127.0.0.1 (inside this container loopback is the
      # server itself, where nothing listens on 5347).
      PUSH_COMPONENT_HOST: ejabberd
      PUSH_STORAGE_KEY: ${PUSH_STORAGE_KEY:-}
      # Native (Android FCM) push, optional (T-1138): the Firebase service
      # account JSON on one line. Empty = native push off.
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      TOOLS_ENABLED: ${TOOLS_ENABLED:-false}
      ROUTINES_ENABLED: ${ROUTINES_ENABLED:-false}
      WEB_TOOLS_ENABLED: ${WEB_TOOLS_ENABLED:-false}
      # Desk sidecar socket (T-1407): see deploy/docker-compose.yml. Fixed:
      # the desk agent runs in every stack, and computers turn on as soon as
      # the host has gVisor (run the --desks-host command once on the host).
      DESK_AGENT_SOCKET: /run/zilar/desk.sock
      # Optional override: the jail image the agent runs, pinned by digest.
      # Empty means the agent follows the release
      # (ghcr.io/<IMAGE_OWNER>/zilar-desk:<IMAGE_TAG>).
      DESK_IMAGE: ${DESK_IMAGE:-}
    expose:
      - '3000'
    healthcheck:
      # Plain node script (no backticks/quoting games through CMD-SHELL):
      # exit 0 only when GET /health answers 2xx within 5 s.
      test: ['CMD', 'node', '/app/deploy-scripts/healthcheck.mjs']
      interval: 10s
      start_interval: 1s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Sticker files (STICKER_STORAGE_DIR above) live on this named volume,
    # not the container layer: without it every server replace wipes them.
    # The server starts as non-root (see apps/server/Dockerfile), so the
    # mount must stay writable by that user (default named-volume ownership).
    # Avatar pictures (AVATAR_STORAGE_DIR above) live on their own named
    # volume, for the same reason.
    volumes:
      - sticker-data:/data/stickers
      - avatar-data:/data/avatars
      # The desk-agent socket (DESK_AGENT_SOCKET above), shared with
      # desk-agent only.
      - desk-socket:/run/zilar

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      # The one public domain of the install. The web container forwards /api,
      # /xmpp-ws and /upload to the server and ejabberd (apps/web/Caddyfile).
      SERVICE_URL_WEB_80: /
    expose:
      - '80'
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1']
      interval: 15s
      start_interval: 1s
      timeout: 5s
      retries: 12
      start_period: 10s

  # --- AI computers (desks) -----------------------------------------------
  # The Coolify app does not run ./zilar: run the host setup command once on
  # the host and these services turn computers on within about a minute, with
  # nothing to set here. desk-agent is the only service with the Docker
  # socket; desk-egress is a jail's only way to the web. The host prep Compose
  # cannot do (gVisor, the shared memory-pool slice) is
  # `curl -fsSL https://get.zilar.app | sudo sh -s -- --desks-host`.
  desk-agent:
    build:
      context: .
      dockerfile: deploy/desk/Dockerfile.agent
    image: zilar-desk-agent:local
    restart: unless-stopped
    user: '0:0'
    privileged: true
    # One image, two entry points: this service is the sidecar (desk-egress
    # picks the proxy below).
    command: ['node', '/app/desk-agent']
    environment:
      DESK_RUNTIME: ${DESK_RUNTIME:-runsc}
      DESK_NETWORK: desk-net
      DESK_CGROUP_PARENT: zilar-desks.slice
      DESK_MAX_RUNNING: ${DESK_MAX_RUNNING:-12}
      # The jail image every AI runs. By default it follows the release,
      # ghcr.io/<IMAGE_OWNER>/zilar-desk:<IMAGE_TAG>, so a redeploy moves the
      # jail image along; DESK_IMAGE overrides it with one pinned by digest.
      DESK_IMAGE_OWNER: ${IMAGE_OWNER:-julioferrero}
      DESK_IMAGE_TAG: ${IMAGE_TAG:-latest}
      DESK_IMAGE: ${DESK_IMAGE:-}
      DESK_WORKSPACE_ROOT: /var/lib/zilar/desks
      DESK_WORKSPACE_MODE: image
      DESK_AGENT_SOCKET: /run/zilar/desk.sock
      DESK_EGRESS_PROXY: http://desk-egress:3128
      DESK_EGRESS_REGISTRY_SOCKET: /run/zilar-egress/desk-egress.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/zilar/desks:/var/lib/zilar/desks
      - /dev:/dev
      - desk-socket:/run/zilar
      - desk-egress-socket:/run/zilar-egress
    healthcheck:
      test: ['CMD-SHELL', 'test -S /run/zilar/desk.sock']
      interval: 15s
      start_interval: 2s
      timeout: 5s
      retries: 12
      start_period: 10s

  desk-egress:
    build:
      context: .
      dockerfile: deploy/desk/Dockerfile.agent
    image: zilar-desk-agent:local
    restart: unless-stopped
    command: ['node', '/app/desk-egress']
    environment:
      DESK_EGRESS_PORT: '3128'
      DESK_EGRESS_REGISTRY_SOCKET: /run/zilar-egress/desk-egress.sock
    volumes:
      - desk-egress-socket:/run/zilar-egress
    networks:
      - desk-net
      - desk-out
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const s=require('node:net').connect(3128,'127.0.0.1');
          s.on('connect',()=>process.exit(0));
          s.on('error',()=>process.exit(1));
      interval: 15s
      start_interval: 2s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  # The jails' network: internal (no route out), and only desk-egress is on it
  # as the way off. A fixed name so the sidecar's `--network desk-net` finds it.
  desk-net:
    name: desk-net
    internal: true
  # desk-egress's own way out to the public web; no other desk container joins.
  desk-out:

volumes:
  postgres-data:
  ejabberd-database:
  ejabberd-uploads:
  # Sticker files (STICKER_STORAGE_DIR=/data/stickers on `server` above).
  sticker-data:
  # Profile pictures (AVATAR_STORAGE_DIR=/data/avatars on `server` above).
  avatar-data:
  # The desk-agent unix socket, shared with `server` (DESK_AGENT_SOCKET).
  desk-socket:
  # The egress policy registry socket, shared by desk-agent and desk-egress.
  desk-egress-socket:
