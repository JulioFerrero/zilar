# Zilar production stack shaped for Coolify.
#
# Coolify supplies the reverse proxy and HTTPS, so there is no `caddy`
# service here: every service exposes its internal port and Coolify routes a
# generated domain to it. Deploy as a Coolify Service of type
# "Docker Compose Empty", paste this file as the Source Compose, and fill
# the variables under Configuration > Environment Variables (see
# docs/INSTALL_DOCKER.md, "The Coolify path").
#
# Coolify conventions used (https://coolify.io/docs/services/configuration/docker-compose):
# - `${VAR:-default}` supplies a fallback. Do not put `:?` on SERVICE_* variables:
#   Coolify then leaves its generated values empty and docker refuses to start.
# - `SERVICE_URL_<SERVICE>_<PORT>` (with an optional path suffix) asks
#   Coolify to generate a domain for that Compose service on that internal
#   port; the same value is reused through the Service as a normal variable.
# - `SERVICE_PASSWORD_<ID>` asks Coolify to generate and persist a random
#   password, shared by every component that references the same name.
#   <ID> must have NO underscore: Coolify leaves `SERVICE_PASSWORD_A_B` empty.
# - Components in one stack reach each other by Compose service name; no
#   `ports:` are published because Coolify's Traefik proxy is the entry point.
# - Health checks live in Compose (Services have no separate health-check UI).
#
# Images are published by .github/workflows/images.yml as
# ghcr.io/<owner>/zilar-postgres and zilar-ejabberd; IMAGE_OWNER/IMAGE_TAG
# pick the release to run. No repository files are mounted: the config is
# baked into the images, so this file works as a lone paste into a Coolify
# "Docker Compose Empty" service (which has no checkout of this repository).
#
# One domain: Coolify routes the install's single domain to the `web` service, and the
# web container forwards /api to the server and /xmpp-ws and /upload to ejabberd
# (apps/web/Caddyfile). The XMPP domain is that same host, so there is nothing to
# configure besides the domain itself.

services:
  postgres:
    image: ghcr.io/${IMAGE_OWNER:-julioferrero}/zilar-postgres:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: postgres
      ZILAR_DB_PASSWORD: ${SERVICE_PASSWORD_ZILARDB}
      EJABBERD_DB_PASSWORD: ${SERVICE_PASSWORD_EJABBERDDB}
      ZILAR_ARCHIVE_DB_PASSWORD: ${SERVICE_PASSWORD_ARCHIVEDB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ejabberd:
    # Production config (ejabberd.yml + jwt-entrypoint.sh) is baked into the
    # image by deploy/ejabberd/Dockerfile; hosts, passwords, the upload URL
    # and the JWT secret arrive as environment below.
    image: ghcr.io/${IMAGE_OWNER:-julioferrero}/zilar-ejabberd:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ['foreground']
    environment:
      # Traefik terminates TLS; ejabberd serves plain HTTP on the Service
      # network. HOST/MUC_HOST/ADMIN come from the public domain you set in
      # Coolify (SERVICE_FQDN roots), passed here as plain variables.
      EJABBERD_MACRO_HOST: ${SERVICE_FQDN_WEB}
      EJABBERD_MACRO_MUC_HOST: rooms.${SERVICE_FQDN_WEB}
      EJABBERD_MACRO_ADMIN: admin@${SERVICE_FQDN_WEB}
      REGISTER_ADMIN_PASSWORD: ${SERVICE_PASSWORD_EJABBERDADMIN}
      EJABBERD_MACRO_SQL_PASSWORD: ${SERVICE_PASSWORD_EJABBERDDB}
      # Push component (T-0145, XEP-0114): the secret the server's component
      # authenticates with. Must equal the server's PUSH_COMPONENT_SECRET
      # below. The placeholder default matches the placeholder in the image:
      # with it the component handshake fails (wrong secret) and push stays
      # non-functional until a real password is generated. `doctor` (plain
      # stack) flags the placeholder in plain words; on Coolify confirm
      # SERVICE_PASSWORD_PUSHCOMPONENT holds a generated value.
      EJABBERD_MACRO_PUSH_COMPONENT_SECRET: ${SERVICE_PASSWORD_PUSHCOMPONENT:-CHANGE_ME_PUSH_COMPONENT_SECRET}
      # push.<XMPP domain> is derived at container start from ZILAR_DOMAIN
      # (see deploy/ejabberd/push-entrypoint.sh): set it to the same value
      # as XMPP_DOMAIN so the entrypoint writes push.<XMPP_DOMAIN>, matching
      # PUSH_COMPONENT_JID below.
      ZILAR_DOMAIN: ${SERVICE_FQDN_WEB}
      ZILAR_XMPP_JWT_SECRET: ${SERVICE_PASSWORD_XMPPJWT}
      EJABBERD_MACRO_UPLOAD_URL: https://${SERVICE_FQDN_WEB}/upload
    expose:
      - '5280'
    volumes:
      - ejabberd-database:/opt/ejabberd/database
      - ejabberd-uploads:/opt/ejabberd/upload
    healthcheck:
      test: ['CMD', 'ejabberdctl', 'status']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  server:
    image: ghcr.io/${IMAGE_OWNER:-julioferrero}/zilar-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ejabberd:
        condition: service_healthy
    environment:
      # See deploy/docker-compose.yml: the mailer is picked at runtime.
      # Explicit SMTP variables below still win (unchanged behaviour); with
      # none of them set, mail comes from the first-run setup screen
      # (T-0161), which stores the Resend key encrypted — so there are no
      # mail secrets to fill in here and no terminal to touch.
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgres://zilar:${SERVICE_PASSWORD_ZILARDB}@postgres:5432/zilar
      XMPP_ARCHIVE_DATABASE_URL: postgres://zilar_archive:${SERVICE_PASSWORD_ARCHIVEDB}@postgres:5432/ejabberd
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_URL: ${SERVICE_URL_WEB}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_BETTERAUTH}
      # The API shares the web app's domain, so the allowed origin is that domain.
      WEB_ORIGINS: ${SERVICE_URL_WEB}
      EJABBERD_API_URL: http://ejabberd:5280/api
      EJABBERD_ADMIN_JID: admin@${SERVICE_FQDN_WEB}
      EJABBERD_ADMIN_PASSWORD: ${SERVICE_PASSWORD_EJABBERDADMIN}
      XMPP_DOMAIN: ${SERVICE_FQDN_WEB}
      XMPP_MUC_DOMAIN: rooms.${SERVICE_FQDN_WEB}
      # The WS handler answers at ejabberd's /ws path, so the public token
      # URL is the routed WS domain plus /ws.
      XMPP_WS_PUBLIC_URL: wss://${SERVICE_FQDN_WEB}/xmpp-ws/ws
      ZILAR_XMPP_JWT_SECRET: ${SERVICE_PASSWORD_XMPPJWT}
      ZILAR_KEY_ENCRYPTION_KEY: ${SERVICE_PASSWORD_KEYENCRYPTION}
      # Where sticker files live: a persistent volume (see `volumes:` below),
      # fixed absolute path, always set — never relative, never empty.
      # A manual edit of this value orphans previously uploaded stickers.
      STICKER_STORAGE_DIR: /data/stickers
      # Where profile pictures live: a persistent volume (see `volumes:`
      # below), fixed absolute path, always set — never relative, never
      # empty. Same rules as the sticker dir.
      AVATAR_STORAGE_DIR: /data/avatars
      # See deploy/docker-compose.yml: an empty string fails the `z.url()`
      # schema, so the default is an unreachable placeholder URL. The AI
      # module treats "no master key" as "no gateway" and the placeholder is
      # never called.
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://127.0.0.1:9}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-@empty@}
      AGENT_GATEWAY_ENABLED: ${AGENT_GATEWAY_ENABLED:-false}
      ACTION_DEMO_ENABLED: ${ACTION_DEMO_ENABLED:-false}
      RUNNER_HUB_ENABLED: ${RUNNER_HUB_ENABLED:-false}
      RUNNER_HUB_PORT: 3189
      # Outgoing email: sign-in codes are sent by email. The first-run
      # setup screen (T-0161) collects the Resend key in the browser and
      # stores it encrypted, so mail needs no variables here. The SMTP
      # overrides below stay for installs that prefer their own provider:
      # when any of them is set, it wins over the stored settings. Empty
      # means unset.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      # Same rule as deploy/docker-compose.yml: leave unfilled Coolify
      # variables unset and the server boots with push off (an empty value
      # fails startup, so delete the line instead of blanking it).
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-}
      # push.<XMPP domain>: must equal the host the entrypoint writes into
      # the ejabberd_service listener from the XMPP_DOMAIN below (see
      # deploy/ejabberd/push-entrypoint.sh). Set ZILAR_DOMAIN to the same
      # value as XMPP_DOMAIN so the entrypoint derives it.
      PUSH_COMPONENT_JID: push.${SERVICE_FQDN_WEB}
      # Must equal ejabberd's EJABBERD_MACRO_PUSH_COMPONENT_SECRET above.
      PUSH_COMPONENT_SECRET: ${SERVICE_PASSWORD_PUSHCOMPONENT:-CHANGE_ME_PUSH_COMPONENT_SECRET}
      PUSH_STORAGE_KEY: ${PUSH_STORAGE_KEY:-}
      TOOLS_ENABLED: ${TOOLS_ENABLED:-false}
      ROUTINES_ENABLED: ${ROUTINES_ENABLED:-false}
      WEB_TOOLS_ENABLED: ${WEB_TOOLS_ENABLED:-false}
    expose:
      - '3000'
    healthcheck:
      # Plain node script (no backticks/quoting games through CMD-SHELL):
      # exit 0 only when GET /health answers 2xx within 5 s.
      test: ['CMD', 'node', '/app/deploy-scripts/healthcheck.mjs']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Sticker files (STICKER_STORAGE_DIR above) live on this named volume,
    # not the container layer: without it every server replace wipes them.
    # The server starts as non-root (see apps/server/Dockerfile), so the
    # mount must stay writable by that user (default named-volume ownership).
    # Avatar pictures (AVATAR_STORAGE_DIR above) live on their own named
    # volume, for the same reason.
    volumes:
      - sticker-data:/data/stickers
      - avatar-data:/data/avatars

  web:
    image: ghcr.io/${IMAGE_OWNER:-julioferrero}/zilar-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      # The one public domain of the install. The web container forwards /api,
      # /xmpp-ws and /upload to the server and ejabberd (apps/web/Caddyfile).
      SERVICE_URL_WEB_80: /
    expose:
      - '80'
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
  ejabberd-database:
  ejabberd-uploads:
  # Sticker files (STICKER_STORAGE_DIR=/data/stickers on `server` above).
  sticker-data:
  # Profile pictures (AVATAR_STORAGE_DIR=/data/avatars on `server` above).
  avatar-data:
