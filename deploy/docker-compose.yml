# Zilar production stack: Postgres (pgvector), ejabberd, the Zilar
# server, the web app and Caddy as the only entry point.
#
# From a fresh clone with a filled deploy/.env:
#
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --wait
#
# Secrets come from the env file (see deploy/.env.example); nothing secret is
# committed or baked into an image. Only `caddy` publishes ports (80/443 by
# default, HTTP_PORT/HTTPS_PORT to override for a local trial). TLS
# terminates at Caddy; every backend speaks plain HTTP on the internal
# `zilar` network. `IMAGE_OWNER`/`IMAGE_TAG` pick the published server and
# web images; postgres and ejabberd always build locally from deploy/ (no
# registry login needed).
#
# Images for `postgres` and `ejabberd` are published by
# .github/workflows/images.yml as ghcr.io/<owner>/zilar-postgres and
# zilar-ejabberd; the plain stack builds them from deploy/postgres/Dockerfile
# and deploy/ejabberd/Dockerfile, so a fresh clone needs no registry login.
# Images for `server` and `web` are published by .github/workflows/images.yml
# as ghcr.io/<owner>/zilar-server and zilar-web. Building them locally
# from the repo root also works:
#
#   docker build -f apps/server/Dockerfile -t zilar-server:local .
#   docker build -f apps/web/Dockerfile -t zilar-web:local .

name: zilar

services:
  postgres:
    # Config is baked into the zilar-postgres image (built from
    # deploy/postgres/Dockerfile, same pgvector 0.8.6-pg18-trixie pin as the
    # dev stack), so a fresh clone builds locally with no registry login.
    image: zilar-postgres:local
    build:
      context: .
      dockerfile: postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
      ZILAR_DB_PASSWORD: ${ZILAR_DB_PASSWORD:?ZILAR_DB_PASSWORD is required}
      EJABBERD_DB_PASSWORD: ${EJABBERD_DB_PASSWORD:?EJABBERD_DB_PASSWORD is required}
      # Read-only role for message search (see 20-search-reader.sql).
      ZILAR_ARCHIVE_DB_PASSWORD: ${ZILAR_ARCHIVE_DB_PASSWORD:?ZILAR_ARCHIVE_DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - zilar

  ejabberd:
    # Config is baked into the zilar-ejabberd image (built from
    # deploy/ejabberd/Dockerfile, same ejabberd 26.07 release as the dev
    # stack), so a fresh clone builds locally with no registry login.
    image: zilar-ejabberd:local
    build:
      context: .
      dockerfile: ejabberd/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # command is repeated because the image ENTRYPOINT drops the base CMD
    # (deploy/ejabberd/Dockerfile sets ENTRYPOINT + CMD identically).
    command: ['foreground']
    environment:
      EJABBERD_MACRO_HOST: ${ZILAR_DOMAIN:?ZILAR_DOMAIN is required}
      EJABBERD_MACRO_MUC_HOST: rooms.${ZILAR_DOMAIN:?ZILAR_DOMAIN is required}
      EJABBERD_MACRO_ADMIN: admin@${ZILAR_DOMAIN:?ZILAR_DOMAIN is required}
      # T-0167: read by our own entrypoint (deploy/ejabberd/jwt-entrypoint.sh),
      # which registers the admin account with all output discarded. Never use
      # the base image's REGISTER_ADMIN_PASSWORD here: it echoes the
      # `ejabberdctl register ... <password>` command line into the log.
      EJABBERD_ADMIN_PASSWORD: ${EJABBERD_ADMIN_PASSWORD:?EJABBERD_ADMIN_PASSWORD is required}
      EJABBERD_MACRO_SQL_PASSWORD: ${EJABBERD_DB_PASSWORD:?EJABBERD_DB_PASSWORD is required}
      # Push component (T-0145, XEP-0114): the secret the server's component
      # authenticates with. Must equal the server's PUSH_COMPONENT_SECRET.
      # The placeholder default matches the placeholder in the yml: with it
      # the component handshake fails (wrong secret) and the server answers
      # its push routes from an unconfigured component — push stays
      # non-functional until a real secret is set on both sides. `doctor`
      # flags the placeholder in plain words.
      EJABBERD_MACRO_PUSH_COMPONENT_SECRET: ${PUSH_COMPONENT_SECRET:-CHANGE_ME_PUSH_COMPONENT_SECRET}
      ZILAR_DOMAIN: ${ZILAR_DOMAIN:?ZILAR_DOMAIN is required}
      ZILAR_XMPP_JWT_SECRET: ${ZILAR_XMPP_JWT_SECRET:?ZILAR_XMPP_JWT_SECRET is required}
      EJABBERD_MACRO_UPLOAD_URL: https://${ZILAR_DOMAIN:?ZILAR_DOMAIN is required}/upload
    volumes:
      - ejabberd-database:/opt/ejabberd/database
      - ejabberd-uploads:/opt/ejabberd/upload
    healthcheck:
      test: ['CMD', 'ejabberdctl', 'status']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks:
      - zilar

  server:
    image: ghcr.io/${IMAGE_OWNER:-julioferrero}/zilar-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ejabberd:
        condition: service_healthy
    environment:
      # Zilar signs people in with an emailed one-time code. The SMTP mailer
      # lands in T-0128; until then the server refuses NODE_ENV=production
      # without a mail transport, so the stack pins NODE_ENV from the env
      # file (development = console mailer, OTP codes go to the server log).
      # NOTE: development mode needs `pino-pretty` (a devDependency the
      # image does not ship), so either keep production + set
      # MAIL_ALLOW_CONSOLE_IN_PRODUCTION=true (scratch only), or wait for
      # T-0128's SMTP mailer for a real install.
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgres://zilar:${ZILAR_DB_PASSWORD:?ZILAR_DB_PASSWORD is required}@postgres:5432/zilar
      XMPP_ARCHIVE_DATABASE_URL: postgres://zilar_archive:${ZILAR_ARCHIVE_DB_PASSWORD:?ZILAR_ARCHIVE_DB_PASSWORD is required}@postgres:5432/ejabberd
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_URL: https://${ZILAR_DOMAIN:?ZILAR_DOMAIN is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      WEB_ORIGINS: https://${ZILAR_DOMAIN:?ZILAR_DOMAIN is required}
      EJABBERD_API_URL: http://ejabberd:5280/api
      EJABBERD_ADMIN_JID: admin@${ZILAR_DOMAIN:?ZILAR_DOMAIN is required}
      EJABBERD_ADMIN_PASSWORD: ${EJABBERD_ADMIN_PASSWORD:?EJABBERD_ADMIN_PASSWORD is required}
      XMPP_DOMAIN: ${ZILAR_DOMAIN:?ZILAR_DOMAIN is required}
      XMPP_MUC_DOMAIN: rooms.${ZILAR_DOMAIN:?ZILAR_DOMAIN is required}
      XMPP_WS_PUBLIC_URL: wss://${ZILAR_DOMAIN:?ZILAR_DOMAIN is required}/xmpp-ws/ws
      ZILAR_XMPP_JWT_SECRET: ${ZILAR_XMPP_JWT_SECRET:?ZILAR_XMPP_JWT_SECRET is required}
      ZILAR_KEY_ENCRYPTION_KEY: ${ZILAR_KEY_ENCRYPTION_KEY:-@empty@}
      # Where sticker files live: a persistent volume (see `volumes:` below),
      # fixed absolute path, always set — never relative, never empty.
      # `init` writes no sticker line (the default here is final); a manual
      # edit of this value orphans previously uploaded stickers.
      STICKER_STORAGE_DIR: /data/stickers
      # Where profile pictures live: a persistent volume (see `volumes:`
      # below), fixed absolute path, always set — never relative, never
      # empty. Same rules as the sticker dir: a manual edit orphans
      # previously uploaded pictures.
      AVATAR_STORAGE_DIR: /data/avatars
      # Where chat background wallpapers live (T-0460): it reuses the existing
      # `avatar-data` volume mounted at /data/avatars, so no new volume is
      # needed. Same rules as the avatar dir: a manual edit orphans previously
      # uploaded wallpapers.
      BACKGROUND_STORAGE_DIR: /data/avatars/backgrounds
      # Compose has no way to say "unset if empty": an empty LITELLM_BASE_URL
      # fails the `z.url()` schema, so default to an unreachable placeholder
      # URL instead. The AI module treats "no master key" as "no gateway",
      # and with no key every AI route answers 503, so the placeholder URL
      # is never called. Set both LITELLM_* variables for real AI features.
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://127.0.0.1:9}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-@empty@}
      AGENT_GATEWAY_ENABLED: ${AGENT_GATEWAY_ENABLED:-false}
      ACTION_DEMO_ENABLED: ${ACTION_DEMO_ENABLED:-false}
      RUNNER_HUB_ENABLED: ${RUNNER_HUB_ENABLED:-false}
      RUNNER_HUB_PORT: 3189
      # Outgoing email: sign-in codes are sent by email. The first-run
      # setup screen (T-0161) collects the Resend key in the browser and
      # stores it encrypted, so a fresh install needs no mail variables.
      # The SMTP variables below stay for installs that prefer their own
      # provider: when any of them is set, it wins over the stored
      # settings. Empty defaults: the server treats an empty value as
      # unset.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_ALLOW_CONSOLE_IN_PRODUCTION: ${MAIL_ALLOW_CONSOLE_IN_PRODUCTION:-false}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      # Push stays optional: `init --no-push` omits the VAPID keys, the
      # subject and the storage key from the env file entirely (missing =
      # unset), so the server boots with push off instead of rejecting an
      # empty string at startup.
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-}
      # push.<install domain>: must equal the host the entrypoint writes into
      # the ejabberd_service listener (see deploy/ejabberd/push-entrypoint.sh).
      PUSH_COMPONENT_JID: push.${ZILAR_DOMAIN:?ZILAR_DOMAIN is required}
      # Must equal ejabberd's EJABBERD_MACRO_PUSH_COMPONENT_SECRET above.
      PUSH_COMPONENT_SECRET: ${PUSH_COMPONENT_SECRET:-CHANGE_ME_PUSH_COMPONENT_SECRET}
      # Host of ejabberd's XEP-0114 component listener (T-0172): the Compose
      # service name, not 127.0.0.1 (inside this container loopback is the
      # server itself, where nothing listens on 5347).
      PUSH_COMPONENT_HOST: ejabberd
      PUSH_STORAGE_KEY: ${PUSH_STORAGE_KEY:-}
      TOOLS_ENABLED: ${TOOLS_ENABLED:-false}
      ROUTINES_ENABLED: ${ROUTINES_ENABLED:-false}
      WEB_TOOLS_ENABLED: ${WEB_TOOLS_ENABLED:-false}
    healthcheck:
      # Plain node script (no backticks/quoting games through CMD-SHELL):
      # exit 0 only when GET /health answers 2xx within 5 s.
      test: ['CMD', 'node', '/app/deploy-scripts/healthcheck.mjs']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Sticker files (STICKER_STORAGE_DIR above) live on this named volume,
    # not the container layer: without it every server replace wipes them.
    # The server starts as non-root (see apps/server/Dockerfile), so the
    # mount must stay writable by that user (default named-volume ownership).
    # Avatar pictures (AVATAR_STORAGE_DIR above) live on their own named
    # volume, for the same reason.
    volumes:
      - sticker-data:/data/stickers
      - avatar-data:/data/avatars
    networks:
      - zilar

  web:
    image: ghcr.io/${IMAGE_OWNER:-julioferrero}/zilar-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - zilar

  caddy:
    # Reverse proxy with automatic HTTPS. The only service publishing ports.
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
      ejabberd:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      ZILAR_DOMAIN: ${ZILAR_DOMAIN:?ZILAR_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:-admin@${ZILAR_DOMAIN:?ZILAR_DOMAIN is required}}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # Ask Caddy itself whether the site is served: HTTPS through the local
    # CA with curl. curl ships in the image; -k trusts the local CA for
    # `localhost`, and for a real domain the public chain validates.
    # --resolve pins SNI/host `localhost` to 127.0.0.1: connections from
    # outside always carry the real domain, so this only affects the probe.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -k -s --resolve localhost:443:127.0.0.1 https://localhost/ -o /dev/null; test $$? -le 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - zilar

networks:
  zilar:
    name: zilar

volumes:
  postgres-data:
  ejabberd-database:
  ejabberd-uploads:
  # Sticker files (STICKER_STORAGE_DIR=/data/stickers on `server` above).
  # Backed up by `./zilar backup` together with the uploads volume.
  sticker-data:
  # Profile pictures (AVATAR_STORAGE_DIR=/data/avatars on `server` above).
  # Backed up by `./zilar backup` together with the sticker volume.
  avatar-data:
  caddy-data:
  caddy-config:
