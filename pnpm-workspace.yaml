packages:
  - apps/*
  - packages/*

catalog:
  '@effect/atom-react': 4.0.2
  '@xmpp/client': ^0.14.0
  better-auth: ^1.7.6
  clsx: ^2.1.1
  class-variance-authority: ^0.7.1
  effect: ^4.0.2
  scheduler: ^0.27.0
  tailwind-merge: ^3.7.0
  tsx: ^4.23.15
  vite: ^8.3.1
  vitest: ^5.0.2

overrides:
  '@types/node': '^24'

onlyBuiltDependencies:
  - esbuild

# T-0272: pnpm 10 resolves ws's optional peers non-deterministically for the
# metro <-> metro-config cycle, flipping bufferutil/utf-8-validate in the
# lockfile. Declaring them here pins the resolution. Drop after pnpm >= 11.8.
packageExtensions:
  '@react-native/metro-config':
    peerDependencies:
      bufferutil: '*'
      utf-8-validate: '*'
    peerDependenciesMeta:
      bufferutil:
        optional: true
      utf-8-validate:
        optional: true
