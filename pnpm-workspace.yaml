packages:
  - apps/*
  - packages/*

catalog:
  '@effect/ai-anthropic': 4.0.4
  '@effect/ai-openai': 4.0.4
  '@effect/ai-openai-compat': 4.0.4
  '@effect/ai-openrouter': 4.0.4
  '@effect/atom-react': 4.0.4
  '@xmpp/client': ^0.14.0
  better-auth: ^1.7.6
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  effect: ^4.0.4
  scheduler: ^0.27.0
  tailwind-merge: ^3.7.0
  tsx: ^4.23.15
  vite: ^8.3.1
  vitest: ^5.0.2

onlyBuiltDependencies:
  - esbuild

overrides:
  '@types/node': '^24'
  drizzle-kit: '-'
  # T-0909: better-auth's optional drizzle peers are auto-installed and then
  # resolve PGlite, which put 25 MB of the test database in the production
  # deploy. The server uses its own SQL adapter, not drizzle.
  drizzle-orm: '-'

# T-0272: pnpm 10 resolves ws's optional peers non-deterministically for the
# metro <-> metro-config cycle, flipping bufferutil/utf-8-validate in the
# lockfile. Declaring them here pins the resolution. Drop after pnpm >= 11.8.
packageExtensions:
  '@react-native/metro-config':
    peerDependencies:
      bufferutil: '*'
      utf-8-validate: '*'
    peerDependenciesMeta:
      bufferutil:
        optional: true
      utf-8-validate:
        optional: true
patchedDependencies:
  expo-share-intent@8.0.1: patches/expo-share-intent@8.0.1.patch

# T-1918: the expo-share-intent patch is for the phone app only. Filtered
# deploys, like the server image's `pnpm --filter @zilar/server deploy`, do not
# install it, so pnpm must not fail them with ERR_PNPM_UNUSED_PATCH.
allowUnusedPatches: true
