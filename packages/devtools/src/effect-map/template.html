<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="How much of the Zilar codebase has moved to Effect, by package and by file."
    />
    <title>Zilar Effect Map</title>
    <style>
      /* Light and dark follow the system setting. Colours are tokens so the canvas
   reads the same values as the page. */
      :root {
        --bg: #f4f6f3;
        --ink: #1b211e;
        --soft: #5d6862;
        --line: #d3dad5;
        --effect: #2e9c4c;
        --plain: #aab3ad;
        --legacy: #d9862b;
        --live: #1f6feb;
        --group: #dfe6e1;
        --group-ink: #1b211e;
        --leaf-ink: #0d1210;
        --tip: #1b211e;
        --tip-ink: #f4f6f3;
        --f-ui: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        --f-data: ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101312;
          --ink: #e4ebe6;
          --soft: #8f9a94;
          --line: #262c29;
          --effect: #2e9c4c;
          --plain: #6b7570;
          --legacy: #e0a040;
          --live: #7fb2ff;
          --group: #1a1f1d;
          --group-ink: #cfd8d2;
          --leaf-ink: #0b0f0d;
          --tip: #fffde6;
          --tip-ink: #141413;
          color-scheme: dark;
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0 auto;
        max-width: 1100px;
        padding: 16px;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.45 var(--f-ui);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.2;
        font-weight: 600;
      }
      p {
        margin: 0;
      }
      h2 {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
      }
      header {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .stat {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 10px;
      }
      .pct {
        font: 600 28px/1 var(--f-data);
        font-variant-numeric: tabular-nums;
      }
      .note,
      .muted {
        color: var(--soft);
        font-size: 13px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        color: var(--soft);
        font-size: 13px;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .sw {
        width: 12px;
        height: 12px;
        display: inline-block;
        border-radius: 2px;
      }
      .sw.effect {
        background: var(--effect);
      }
      .sw.plain {
        background: var(--plain);
      }
      .sw.legacy {
        background: var(--legacy);
      }
      .sw.open {
        outline: 2px solid var(--live);
        outline-offset: -2px;
        background: var(--group);
      }
      nav {
        font: 12px/1.4 var(--f-data);
        color: var(--soft);
        min-height: 17px;
        overflow-wrap: anywhere;
      }
      nav button {
        font: inherit;
        color: var(--ink);
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      nav button:focus-visible {
        outline: 1px dotted var(--ink);
      }
      .well {
        position: relative;
        height: min(68vh, 620px);
        min-height: 300px;
        border: 1px solid var(--line);
        overflow: hidden;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: manipulation;
      }
      .tip {
        position: absolute;
        z-index: 2;
        pointer-events: none;
        max-width: min(360px, 80%);
        padding: 6px 8px;
        background: var(--tip);
        color: var(--tip-ink);
        font: 12px/1.35 var(--f-data);
        box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.3);
        overflow-wrap: anywhere;
      }
      .tip b {
        font-weight: 600;
      }
      section {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .table {
        display: flex;
        flex-direction: column;
        min-width: 0;
        font: 13px/1.35 var(--f-data);
      }
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 3rem 6.5rem 4rem;
        gap: 8px;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid var(--line);
      }
      .row.head {
        color: var(--soft);
        font-size: 12px;
      }
      .row.total {
        font-weight: 600;
      }
      .row > span {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .row > span:not(:first-child) {
        text-align: right;
      }
      .eff {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
      }
      .bar {
        flex: 1 1 auto;
        height: 8px;
        background: var(--line);
        min-width: 24px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--effect);
      }
      .eff b {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        min-width: 3.4rem;
        text-align: right;
      }
      .tasks {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .tasks li {
        overflow-wrap: anywhere;
      }
      footer {
        color: var(--soft);
        font: 12px/1.4 var(--f-data);
        overflow-wrap: anywhere;
      }
      @media (max-width: 420px) {
        body {
          padding: 14px;
        }
        .row {
          grid-template-columns: minmax(0, 1fr) 2.6rem 5rem 3.2rem;
          gap: 6px;
          font-size: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Effect migration map</h1>
      <div class="stat">
        <span class="pct" id="pct"></span>
        <span class="note" id="pct-note"></span>
      </div>
      <div class="legend" aria-label="Legend">
        <span><i class="sw effect"></i>Effect</span>
        <span><i class="sw plain"></i>plain (no Effect, no legacy)</span>
        <span><i class="sw legacy"></i>still imports drizzle, hono, zod or zustand</span>
        <span><i class="sw open"></i>open task (todo, in-progress, review)</span>
      </div>
    </header>

    <nav id="crumbs" aria-label="Folder path"></nav>
    <div class="well">
      <canvas
        id="map"
        role="img"
        aria-label="Every counted source file as a box sized by lines, coloured by kind; boxes with a blue outline belong to an open task"
      ></canvas>
      <div class="tip" id="tip" hidden></div>
    </div>

    <section aria-labelledby="packages-h">
      <h2 id="packages-h">Per package</h2>
      <p class="note">
        Share of lines that use Effect, and files that still import a legacy library.
      </p>
      <div class="table" id="packages"></div>
    </section>

    <section aria-labelledby="tasks-h">
      <h2 id="tasks-h">Open tasks</h2>
      <ul class="tasks" id="tasks"></ul>
    </section>

    <footer id="meta"></footer>

    <script>
      const MAP = /*DATA*/ null;

      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      const fmt = (n) => n.toLocaleString('en-US');
      const pct = (n) => `${n.toFixed(1)}%`;
      const KIND_NAME = { effect: 'Effect', plain: 'plain', legacy: 'legacy' };

      const canvas = $('map');
      const ctx = canvas.getContext('2d');
      const tip = $('tip');
      const dark = matchMedia('(prefers-color-scheme: dark)');

      let palette = {};
      let zoom = null;
      let trail = [];
      let leaves = [];
      let groups = [];
      let hover = null;
      let W = 1;
      let H = 1;
      let dpr = 1;

      function readPalette() {
        const style = getComputedStyle(document.documentElement);
        const get = (name) => style.getPropertyValue(name).trim();
        palette = {
          effect: get('--effect'),
          plain: get('--plain'),
          legacy: get('--legacy'),
          live: get('--live'),
          group: get('--group'),
          groupInk: get('--group-ink'),
          leafInk: get('--leaf-ink'),
          bg: get('--bg'),
          ui: get('--f-ui'),
          mono: get('--f-data'),
        };
      }

      // One node per folder, one per file. Folders with a single subfolder are
      // merged ("apps/server/src") so the map does not nest needlessly.
      function buildTree(files) {
        const root = { name: 'zilar', path: '', children: [] };
        const dirs = new Map([['', root]]);
        for (const file of files) {
          const parts = file.path.split('/');
          let parent = root;
          for (let i = 0; i < parts.length - 1; i++) {
            const path = parts.slice(0, i + 1).join('/');
            let dir = dirs.get(path);
            if (!dir) {
              dir = { name: parts[i], path, children: [] };
              dirs.set(path, dir);
              parent.children.push(dir);
            }
            parent = dir;
          }
          parent.children.push({
            name: parts[parts.length - 1],
            path: file.path,
            file,
            value: file.lines,
          });
        }
        const sum = (node) => {
          if (node.file) return;
          node.children.forEach(sum);
          node.value = node.children.reduce((s, c) => s + c.value, 0);
          node.effectLines = node.children.reduce(
            (s, c) => s + (c.file ? (c.file.kind === 'effect' ? c.value : 0) : c.effectLines),
            0,
          );
        };
        sum(root);
        const squash = (node) => {
          if (node.file) return node;
          node.children = node.children.map((child) => {
            let c = child;
            while (!c.file && c.children.length === 1 && !c.children[0].file) {
              const only = c.children[0];
              c = { ...only, name: `${c.name}/${only.name}` };
            }
            return squash(c);
          });
          return node;
        };
        squash(root);
        const link = (node, parent) => {
          node.parent = parent;
          (node.children ?? []).forEach((c) => link(c, node));
        };
        link(root, null);
        return root;
      }

      // Squarified treemap: rows of boxes whose aspect ratios stay close to square.
      function squarify(nodes, x, y, w, h, out) {
        const items = nodes.filter((n) => n.value > 0).sort((a, b) => b.value - a.value);
        const total = items.reduce((s, n) => s + n.value, 0);
        if (!total || w <= 0 || h <= 0) return;
        const scale = (w * h) / total;
        const queue = items.map((n) => ({ n, a: n.value * scale }));
        let row = [];
        const worst = (r, side) => {
          if (!r.length) return Infinity;
          let s = 0,
            mx = 0,
            mn = Infinity;
          for (const it of r) {
            s += it.a;
            mx = Math.max(mx, it.a);
            mn = Math.min(mn, it.a);
          }
          return Math.max((side * side * mx) / (s * s), (s * s) / (side * side * mn));
        };
        const place = () => {
          const s = row.reduce((t, it) => t + it.a, 0);
          if (w >= h) {
            const cw = s / h;
            let cy = y;
            for (const it of row) {
              const hh = it.a / cw;
              out.push({ n: it.n, x, y: cy, w: cw, h: hh });
              cy += hh;
            }
            x += cw;
            w -= cw;
          } else {
            const rh = s / w;
            let cx = x;
            for (const it of row) {
              const ww = it.a / rh;
              out.push({ n: it.n, x: cx, y, w: ww, h: rh });
              cx += ww;
            }
            y += rh;
            h -= rh;
          }
          row = [];
        };
        while (queue.length) {
          const side = Math.min(w, h);
          if (!row.length || worst([...row, queue[0]], side) <= worst(row, side))
            row.push(queue.shift());
          else place();
        }
        if (row.length) place();
      }

      function layout() {
        const rect = canvas.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = Math.max(1, Math.round(rect.width));
        H = Math.max(1, Math.round(rect.height));
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        leaves = [];
        groups = [];
        const walk = (node, x, y, w, h, depth) => {
          const out = [];
          squarify(node.children, x, y, w, h, out);
          for (const r of out) {
            if (r.n.file) {
              leaves.push({ node: r.n, x: r.x, y: r.y, w: r.w, h: r.h });
              continue;
            }
            const head = r.w > 46 && r.h > 34 ? 14 : 0;
            groups.push({ node: r.n, x: r.x, y: r.y, w: r.w, h: r.h, head, depth });
            const pad = r.w > 8 && r.h > 8 ? 1 : 0;
            walk(r.n, r.x + pad, r.y + head + pad, r.w - pad * 2, r.h - head - pad * 2, depth + 1);
          }
        };
        walk(zoom, 0, 0, W, H, 0);
        renderCrumbs();
        draw();
      }

      function cushion(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w, h);
        if (w < 3 || h < 3) return;
        const cx = x + w * 0.38,
          cy = y + h * 0.32;
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.85);
        grad.addColorStop(0, 'rgba(255,255,255,0.34)');
        grad.addColorStop(0.45, 'rgba(255,255,255,0.05)');
        grad.addColorStop(1, 'rgba(0,0,0,0.42)');
        ctx.fillStyle = grad;
        ctx.fillRect(x, y, w, h);
      }

      function clip(text, max) {
        if (ctx.measureText(text).width <= max) return text;
        let t = text;
        while (t.length > 1 && ctx.measureText(`${t}…`).width > max) t = t.slice(0, -1);
        return t.length > 1 ? `${t}…` : '';
      }

      function draw() {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = palette.bg;
        ctx.fillRect(0, 0, W, H);
        for (const g of groups) {
          ctx.fillStyle = palette.group;
          ctx.fillRect(g.x, g.y, g.w, g.h);
        }
        ctx.textBaseline = 'top';
        for (const l of leaves) {
          const gap = l.w > 4 && l.h > 4 ? 0.5 : 0;
          cushion(l.x + gap, l.y + gap, l.w - gap * 2, l.h - gap * 2, palette[l.node.file.kind]);
          if (l.w > 70 && l.h > 16) {
            ctx.font = `11px ${palette.mono}`;
            ctx.fillStyle = palette.leafInk;
            ctx.fillText(clip(l.node.name, l.w - 8), l.x + 4, l.y + 3);
          }
        }
        for (const l of leaves) {
          if (l.node.file.tasks.length === 0) continue;
          ctx.strokeStyle = palette.live;
          ctx.lineWidth = 2;
          ctx.strokeRect(l.x + 1, l.y + 1, l.w - 2, l.h - 2);
        }
        ctx.textBaseline = 'middle';
        for (const g of groups) {
          if (!g.head) continue;
          const share = g.node.value ? Math.round((g.node.effectLines / g.node.value) * 100) : 0;
          ctx.font = `11px ${palette.ui}`;
          ctx.fillStyle = palette.groupInk;
          ctx.fillText(clip(`${g.node.name}  ${share}%`, g.w - 8), g.x + 4, g.y + 7);
        }
        if (hover) {
          ctx.strokeStyle = palette.leafInk;
          ctx.lineWidth = 2;
          ctx.strokeRect(hover.x + 1, hover.y + 1, hover.w - 2, hover.h - 2);
        }
      }

      function renderCrumbs() {
        trail = [];
        for (let n = zoom; n; n = n.parent) trail.unshift(n);
        $('crumbs').innerHTML =
          trail.length === 1
            ? 'Click a folder to zoom in.'
            : trail
                .map((n, i) =>
                  i === trail.length - 1
                    ? esc(n.name)
                    : `<button type="button" data-i="${i}">${esc(n.name)}</button>`,
                )
                .join(' / ');
      }

      function leafAt(x, y) {
        return leaves.find((l) => x >= l.x && x < l.x + l.w && y >= l.y && y < l.y + l.h) ?? null;
      }
      function folderAt(x, y) {
        const hits = groups.filter((g) => x >= g.x && x < g.x + g.w && y >= g.y && y < g.y + g.h);
        return hits.at(-1) ?? null;
      }

      function tipHtml(leaf) {
        const f = leaf.node.file;
        let html = `<b>${esc(f.path)}</b><br>${fmt(f.lines)} lines · ${KIND_NAME[f.kind]}`;
        if (f.legacy.length) html += `<br>still imports ${esc(f.legacy.join(', '))}`;
        for (const t of f.tasks) html += `<br>open task ${esc(t.id)} (${esc(t.status)})`;
        return html;
      }

      function showTip(leaf, x, y) {
        tip.innerHTML = tipHtml(leaf);
        tip.hidden = false;
        const left = Math.min(x + 14, W - tip.offsetWidth - 4);
        tip.style.left = `${Math.max(4, left)}px`;
        const below = y + 16 + tip.offsetHeight <= H;
        tip.style.top = `${below ? y + 16 : Math.max(4, y - tip.offsetHeight - 8)}px`;
      }

      function hideTip() {
        tip.hidden = true;
        hover = null;
      }

      function pointer(e) {
        const r = canvas.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }

      canvas.addEventListener('pointermove', (e) => {
        if (e.pointerType !== 'mouse') return;
        const { x, y } = pointer(e);
        const leaf = leafAt(x, y);
        hover = leaf;
        if (leaf) showTip(leaf, x, y);
        else hideTip();
        draw();
      });
      canvas.addEventListener('pointerleave', (e) => {
        if (e.pointerType !== 'mouse') return;
        hideTip();
        draw();
      });
      canvas.addEventListener('click', (e) => {
        const { x, y } = pointer(e);
        const folder = folderAt(x, y);
        if (folder) {
          zoom = folder.node;
          hideTip();
          layout();
          return;
        }
        const leaf = leafAt(x, y);
        if (leaf) {
          hover = leaf;
          showTip(leaf, x, y);
          draw();
        }
      });
      $('crumbs').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-i]');
        if (!b) return;
        zoom = trail[Number(b.dataset.i)] ?? zoom;
        hideTip();
        layout();
      });

      function renderSummary() {
        const t = MAP.total;
        $('pct').textContent = pct(t.effectLinesPct);
        $('pct-note').textContent =
          `of lines use Effect · ${pct(t.effectFilesPct)} of files · ${fmt(t.kinds.legacy.files)} legacy files · ${MAP.tasks.length} open tasks`;
      }

      function renderPackages() {
        const line = (p, cls) =>
          `<div class="row${cls}">` +
          `<span>${esc(p.name)}</span>` +
          `<span>${fmt(p.files)}</span>` +
          `<span class="eff"><span class="bar"><i style="width:${p.effectLinesPct}%"></i></span><b>${pct(p.effectLinesPct)}</b></span>` +
          `<span>${fmt(p.kinds.legacy.files)}</span>` +
          '</div>';
        $('packages').innerHTML = [
          '<div class="row head"><span>Package</span><span>Files</span><span>Effect (lines)</span><span>Legacy</span></div>',
          line({ name: 'All packages', ...MAP.total }, ' total'),
          ...MAP.packages.map((p) => line(p, '')),
        ].join('');
      }

      function renderTasks() {
        $('tasks').innerHTML = MAP.tasks.length
          ? MAP.tasks
              .map(
                (t) =>
                  `<li><b>${esc(t.id)}</b> ${esc(t.title)} <span class="muted">${esc(t.status)} · ${fmt(t.files)} files</span></li>`,
              )
              .join('')
          : '<li class="muted">No open tasks.</li>';
      }

      function renderMeta() {
        const when = new Date(MAP.generatedAt).toISOString().slice(0, 16).replace('T', ' ');
        $('meta').textContent = `Generated ${when} UTC from ${MAP.commit} ${MAP.commitSubject}`;
      }

      readPalette();
      zoom = buildTree(MAP.files);
      renderSummary();
      renderPackages();
      renderTasks();
      renderMeta();
      layout();

      let resizeTimer;
      new ResizeObserver(() => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(layout, 80);
      }).observe(canvas);
      dark.addEventListener('change', () => {
        readPalette();
        draw();
      });
    </script>
  </body>
</html>
