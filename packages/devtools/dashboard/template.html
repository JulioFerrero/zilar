<title>Zilar Lead Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
/>
<style>
  /* Layout: one column. A summary strip, then what needs the lead, then each
     task in flight with a four-step tracker, then the queue and today's merges. */
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --surface-2: #e9edf3;
    --fg: #14202e;
    --muted: #5a6879;
    --line: #d5dce6;
    --run: #1f6fd1;
    --run-soft: #dfeafa;
    --need: #b45309;
    --need-soft: #fdecd2;
    --ok: #17803d;
    --ok-soft: #d9f2e2;
    --bad: #b42318;
    --bad-soft: #fde1de;
    --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #0e141c;
      --surface: #161e29;
      --surface-2: #1f2937;
      --fg: #e6ecf4;
      --muted: #93a1b4;
      --line: #263243;
      --run: #6aa9ff;
      --run-soft: #17304f;
      --need: #f2b155;
      --need-soft: #3a2a10;
      --ok: #55c982;
      --ok-soft: #12301f;
      --bad: #ff8a80;
      --bad-soft: #3d1b18;
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --bg: #0e141c;
    --surface: #161e29;
    --surface-2: #1f2937;
    --fg: #e6ecf4;
    --muted: #93a1b4;
    --line: #263243;
    --run: #6aa9ff;
    --run-soft: #17304f;
    --need: #f2b155;
    --need-soft: #3a2a10;
    --ok: #55c982;
    --ok-soft: #12301f;
    --bad: #ff8a80;
    --bad-soft: #3d1b18;
    color-scheme: dark;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.45;
    padding-inline: 16px;
    padding-block: 20px 40px;
  }
  main {
    max-width: 880px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    text-wrap: balance;
  }
  h2 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .mono {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px 16px;
  }
  .stamp {
    color: var(--muted);
    font-size: 13px;
    min-width: 0;
  }
  .summary {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--fg);
    font-size: 13px;
    font-weight: 500;
  }
  .chip b {
    font-family: var(--font-mono);
    font-weight: 500;
  }
  .chip.need {
    background: var(--need-soft);
    color: var(--need);
  }
  .chip.run {
    background: var(--run-soft);
    color: var(--run);
  }
  .chip.ok {
    background: var(--ok-soft);
    color: var(--ok);
  }
  .stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .task {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }
  .task.need {
    border-color: var(--need);
    box-shadow: inset 4px 0 0 var(--need);
  }
  .task.bad {
    border-color: var(--bad);
    box-shadow: inset 4px 0 0 var(--bad);
  }
  .top {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    align-items: baseline;
    min-width: 0;
  }
  .id {
    font-family: var(--font-mono);
    font-weight: 500;
  }
  .title {
    flex: 1 1 260px;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .model {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
  }
  .steps {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .steps li {
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .steps li.done {
    background: var(--ok-soft);
    color: var(--ok);
  }
  .steps li.now {
    background: var(--run-soft);
    color: var(--run);
    font-weight: 600;
  }
  .task.need .steps li.now {
    background: var(--need-soft);
    color: var(--need);
  }
  .task.bad .steps li.now {
    background: var(--bad-soft);
    color: var(--bad);
  }
  .now-line {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    align-items: baseline;
  }
  .phase {
    font-weight: 600;
  }
  .times {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    color: var(--muted);
    font-size: 13px;
  }
  .times span b {
    color: var(--fg);
    font-weight: 500;
    font-family: var(--font-mono);
  }
  .warn {
    color: var(--bad);
    font-weight: 600;
  }
  .note {
    color: var(--muted);
    font-size: 13px;
    overflow-wrap: anywhere;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 12px;
    padding: 8px 0;
    border-top: 1px solid var(--line);
    min-width: 0;
  }
  .row:first-child {
    border-top: 0;
  }
  .row .text {
    flex: 1 1 240px;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 16px;
  }
  .empty {
    color: var(--muted);
    padding: 10px 0;
  }
  .tag {
    font-size: 12px;
    color: var(--muted);
  }
  @media (max-width: 520px) {
    .steps {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  @media (prefers-reduced-motion: no-preference) {
    .task {
      transition: border-color 0.2s;
    }
  }
</style>

<main>
  <header>
    <h1>Zilar lead board</h1>
    <div class="stamp" id="stamp"></div>
  </header>
  <div class="summary" id="summary"></div>
  <section id="need-section" hidden>
    <h2>Needs you</h2>
    <div class="stack" id="need"></div>
  </section>
  <section>
    <h2>In flight</h2>
    <div class="stack" id="flight"></div>
  </section>
  <section>
    <h2>Queued</h2>
    <div class="panel" id="queued"></div>
  </section>
  <section>
    <h2>Merged today</h2>
    <div class="panel" id="merged"></div>
  </section>
</main>

<script id="snapshot" type="application/json">
  __SNAPSHOT__
</script>
<script>
  var data = JSON.parse(document.getElementById('snapshot').textContent);
  var STEPS = ['Coding', 'Review fixes', 'Pre-review', 'Lead'];
  var STEP_OF = {
    coding: 0,
    idle: 0,
    quota: 0,
    blocked: 0,
    fixing: 1,
    'starting-prereview': 2,
    prereview: 2,
    'waiting-lead': 3,
  };
  var STALE_MIN = 25;

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function age(iso) {
    if (!iso) return 'unknown';
    var minutes = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000));
    if (minutes < 1) return 'under 1 min';
    if (minutes < 60) return minutes + ' min';
    var hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + ' h' + (minutes % 60 ? ' ' + (minutes % 60) + ' min' : '');
    return Math.floor(hours / 24) + ' d ' + (hours % 24) + ' h';
  }

  function minutesSince(iso) {
    return iso ? (Date.now() - Date.parse(iso)) / 60000 : 0;
  }

  function clock(iso) {
    return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function taskCard(task) {
    var phase = task.phase;
    var running =
      phase.id === 'coding' ||
      phase.id === 'fixing' ||
      phase.id === 'prereview' ||
      phase.id === 'starting-prereview';
    var silent = running && minutesSince(task.lastActivity) > STALE_MIN;
    var bad = phase.id === 'blocked' || phase.id === 'idle' || silent;
    var card = el('article', 'task' + (phase.needsLead ? ' need' : '') + (bad ? ' bad' : ''));

    var top = el('div', 'top');
    top.appendChild(el('span', 'id', task.id));
    top.appendChild(el('span', 'title', task.title));
    top.appendChild(el('span', 'model', task.model));
    card.appendChild(top);

    var steps = el('ol', 'steps');
    var at = STEP_OF[phase.id];
    STEPS.forEach(function (name, index) {
      steps.appendChild(el('li', index < at ? 'done' : index === at ? 'now' : '', name));
    });
    card.appendChild(steps);

    var line = el('div', 'now-line');
    line.appendChild(el('span', 'phase', phase.label));
    if (task.phaseSince) {
      var span = el('span', 'tag');
      span.textContent = 'for ' + age(task.phaseSince);
      span.dataset.since = task.phaseSince;
      span.dataset.prefix = 'for ';
      line.appendChild(span);
    }
    card.appendChild(line);

    var times = el('div', 'times');
    [
      ['In progress', task.startedAt, false],
      ['Last activity', task.lastActivity, true],
    ].forEach(function (pair) {
      var wrap = el('span');
      wrap.appendChild(document.createTextNode(pair[0] + ' '));
      var value = el('b', '', age(pair[1]));
      value.dataset.since = pair[1];
      if (pair[2] && silent) value.className = 'warn';
      wrap.appendChild(value);
      times.appendChild(wrap);
    });
    var commits = el('span');
    commits.appendChild(document.createTextNode('Commits '));
    commits.appendChild(el('b', '', String(task.commits)));
    times.appendChild(commits);
    if (task.autoFixRounds > 0) {
      var rounds = el('span');
      rounds.appendChild(document.createTextNode('Auto fix rounds '));
      rounds.appendChild(el('b', '', String(task.autoFixRounds)));
      times.appendChild(rounds);
    }
    card.appendChild(times);

    if (silent)
      card.appendChild(
        el(
          'div',
          'note warn',
          'No activity for ' + age(task.lastActivity) + '. The worker may be stuck.',
        ),
      );
    if (task.lastEscalation) card.appendChild(el('div', 'note', task.lastEscalation));
    return card;
  }

  function render() {
    var need = data.active.filter(function (t) {
      return t.phase.needsLead;
    });
    var flight = data.active.filter(function (t) {
      return !t.phase.needsLead;
    });

    var summary = document.getElementById('summary');
    summary.textContent = '';
    [
      ['need', need.length, 'need you'],
      ['run', flight.length, 'running'],
      ['', data.queued.length, 'queued'],
      ['ok', data.mergedToday.length, 'merged today'],
    ].forEach(function (c) {
      var chip = el('span', 'chip ' + c[0]);
      chip.appendChild(el('b', '', String(c[1])));
      chip.appendChild(document.createTextNode(c[2]));
      summary.appendChild(chip);
    });

    var needBox = document.getElementById('need');
    needBox.textContent = '';
    need.forEach(function (t) {
      needBox.appendChild(taskCard(t));
    });
    document.getElementById('need-section').hidden = need.length === 0;

    var flightBox = document.getElementById('flight');
    flightBox.textContent = '';
    if (flight.length === 0) flightBox.appendChild(el('div', 'empty', 'No worker is running.'));
    flight.forEach(function (t) {
      flightBox.appendChild(taskCard(t));
    });

    var queued = document.getElementById('queued');
    queued.textContent = '';
    if (data.queued.length === 0)
      queued.appendChild(el('div', 'empty', 'Nothing waiting for a slot.'));
    data.queued.forEach(function (q) {
      var row = el('div', 'row');
      row.appendChild(el('span', 'id', q.id));
      row.appendChild(el('span', 'text', q.title));
      row.appendChild(el('span', 'tag', q.status === 'blocked' ? 'blocked' : 'spec ready'));
      queued.appendChild(row);
    });

    var merged = document.getElementById('merged');
    merged.textContent = '';
    if (data.mergedToday.length === 0)
      merged.appendChild(el('div', 'empty', 'Nothing merged yet today.'));
    data.mergedToday.forEach(function (m) {
      var row = el('div', 'row');
      row.appendChild(el('span', 'id', m.id));
      row.appendChild(el('span', 'text', m.summary));
      row.appendChild(el('span', 'tag mono', clock(m.time)));
      merged.appendChild(row);
    });
    tick();
  }

  function tick() {
    document.getElementById('stamp').textContent =
      'Snapshot at ' +
      clock(data.generatedAt) +
      ', ' +
      age(data.generatedAt) +
      ' ago. Ask Claude to refresh.';
    document.querySelectorAll('[data-since]').forEach(function (node) {
      if (!node.dataset.since) return;
      node.textContent = (node.dataset.prefix || '') + age(node.dataset.since);
    });
  }

  render();
  setInterval(tick, 30000);
</script>
