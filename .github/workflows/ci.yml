# Faster CI (T-0754). Measured on 2026-10-09: 21 of the last 30 CI runs on main were
# cancelled, because every push restarted CI, including the lead's work/ board and
# status commits that change no code; green runs took 15 minutes on average (11 to 17).
# So a push that only touches work/**, docs/** or *.md does not start CI at all, and
# the checks run as four parallel jobs (static, typecheck, test, build), each with the
# local Turborepo cache restored, so a code push to main verifies in about 5 minutes.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['work/**', 'docs/**', '**/*.md']
  pull_request:

# Pull requests cancel stale runs. On main the running check finishes and GitHub keeps only
# the newest pending run, so a busy merge day still gets a verified tip (T-0774: runs were
# cancelled before they finished for over an hour on 2026-10-09).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    name: Format and lint
    runs-on: ubuntu-latest
    # a hung check must fail the run, not hold a runner for GitHub's six-hour default
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turborepo 2 keeps its local cache in .turbo/cache (no remote cache, no secrets).
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - run: pnpm typecheck

  # The server tests are about 80% of the old single test job (T-0860), so they run as three
  # vitest shards (each file runs in exactly one shard); every other package runs in one
  # `rest` leg through turbo. The legs run in parallel and fail independently.
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    # a hung test must fail the run, not hold a runner for GitHub's six-hour default
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server 1/3
            id: server-1
            command: pnpm --filter @zilar/server exec vitest run --shard=1/3 --testTimeout=30000 --hookTimeout=30000
          - name: server 2/3
            id: server-2
            command: pnpm --filter @zilar/server exec vitest run --shard=2/3 --testTimeout=30000 --hookTimeout=30000
          - name: server 3/3
            id: server-3
            command: pnpm --filter @zilar/server exec vitest run --shard=3/3 --testTimeout=30000 --hookTimeout=30000
          - name: rest
            id: rest
            command: pnpm exec turbo test --filter='!@zilar/server'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turborepo 2 keeps its local cache in .turbo/cache (no remote cache, no secrets).
      # The key includes the matrix id so the parallel legs never share one cache entry.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ matrix.id }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ matrix.id }}-

      - run: ${{ matrix.command }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turborepo 2 keeps its local cache in .turbo/cache (no remote cache, no secrets).
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - run: pnpm build
