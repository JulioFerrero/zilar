name: Certificate expiry

# Checks the TLS certificates of the public hosts once a day. A failing
# scheduled run is emailed to the owner by GitHub, which is the alert. Let's
# Encrypt renews a certificate once 30 days are left, so under 14 days left
# means the renewal failed. No secrets, no checkout.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificates:
    name: Check TLS certificate expiry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify certificate expiry
        run: |
          set -euo pipefail
          failed=0
          for host in chat.zilar.app zilar.app; do
            raw=$(echo | openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null || true)
            enddate="${raw#notAfter=}"
            if [ -z "$enddate" ]; then
              echo "::error::$host: could not read the TLS certificate end date"
              failed=1
              continue
            fi
            end_epoch=$(date -d "$enddate" +%s 2>/dev/null) || {
              echo "::error::$host: could not parse the certificate end date '$enddate'"
              failed=1
              continue
            }
            now_epoch=$(date +%s)
            days=$(( (end_epoch - now_epoch) / 86400 ))
            echo "$host: $days days left ($enddate)"
            if [ "$days" -lt 14 ]; then
              echo "::error::$host: certificate expires in $days days; the renewal has failed"
              failed=1
            fi
          done
          exit "$failed"
