name: Production images

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build production images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed only when pushing on a version tag; harmless on pull requests.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: galena-server
            file: apps/server/Dockerfile
            context: .
          - name: galena-web
            file: apps/web/Dockerfile
            context: .
          - name: galena-postgres
            file: deploy/postgres/Dockerfile
            context: deploy
          - name: galena-ejabberd
            file: deploy/ejabberd/Dockerfile
            context: deploy
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.name }} (no push)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: docker/build-push-action@v8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Build and push ${{ matrix.name }}
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.ref_name }}
