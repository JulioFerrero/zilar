name: Production images

on:
  pull_request:
  push:
    tags:
      - 'v*'
  # A green CI run on main publishes latest and deploys it (see docs/RELEASING.md §9).
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Green-main builds publish :latest, so only one may run at a time; a newer run
# waits behind the one in flight (GitHub keeps only the newest pending run).
# Tag and PR builds get a per-run group and stay independent.
concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'publish-main' || format('images-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # workflow_run builds overlap and can finish out of order; only the current
  # tip of main may publish, so a stale run ends green without building.
  tip:
    name: Check main tip
    runs-on: ubuntu-latest
    # Incident T-0750: a stalled job held the publish-main group for 3h18m.
    timeout-minutes: 5
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    outputs:
      latest: ${{ steps.compare.outputs.latest }}
    steps:
      # Full history of main, so the path-filtered log below can find the last code commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare the triggering sha with the last code commit on main
        id: compare
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Docs-only pushes skip CI (T-0754), so the tip of main can be a docs
          # commit that never built. work/, docs/ and *.md commits do not count.
          code_tip="$(git log -1 --format=%H origin/main -- . ':(exclude)work/**' ':(exclude)docs/**' ':(exclude)**/*.md')"
          if [ "$code_tip" = "$HEAD_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
            echo "${HEAD_SHA} is the last code commit on main; publishing."
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: ${HEAD_SHA} is no longer the last code commit on main (it is ${code_tip})."
          fi

  build:
    name: Build production images
    runs-on: ubuntu-latest
    # Incident T-0750: a stalled build held the publish-main group for 3h18m.
    timeout-minutes: 30
    needs: [tip]
    # workflow_run fires for failed CI runs too; only a green main push builds.
    # Requiring event == 'push' rejects fork PRs whose head branch is named main.
    # always() lets tag/PR builds run when `tip` is skipped; for a workflow_run
    # the tip check must also confirm this sha is still the tip of main.
    if: always() && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && needs.tip.outputs.latest == 'true'))
    permissions:
      contents: read
      # Needed only when pushing on a version tag or after a green CI on main.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: zilar-server
            file: apps/server/Dockerfile
            context: .
          - name: zilar-web
            file: apps/web/Dockerfile
            context: .
          - name: zilar-postgres
            file: deploy/postgres/Dockerfile
            context: deploy
          - name: zilar-ejabberd
            file: deploy/ejabberd/Dockerfile
            context: deploy
    steps:
      - uses: actions/checkout@v7
        with:
          # On a workflow_run, build the exact commit CI verified.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # Only version tags build arm64 (self-hosters may run ARM). Green-main and PR
      # builds are amd64 only: the live host is x86_64 and the QEMU arm64 leg hung
      # for 3h18m (run 37911863834).
      - name: Set up QEMU for the arm64 release images
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # The commit baked into the server image and reported by /health. On a
      # workflow_run it is the head sha CI passed; on a tag or PR build it is
      # the commit that was checked out.
      - name: Resolve build commit
        id: commit
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CHECKED_OUT_SHA: ${{ github.sha }}
        run: |
          sha="${HEAD_SHA:-$CHECKED_OUT_SHA}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$(printf '%s' "$sha" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # GHCR only accepts lowercase repository names
      - name: Image name
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_run'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds the amd64 server image for the smoke start from the gha cache that the
      # green-main build writes (scope per image), so a warm run skips the rebuild.
      - name: Build the server image for the smoke start
        if: matrix.name == 'zilar-server'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: zilar-server:smoke
          cache-from: type=gha,scope=${{ matrix.name }}

      # Why this step exists (T-0739): on 2026-10-09 the server image crash-looped
      # at start (ERR_MODULE_NOT_FOUND for @electric-sql/pglite, a devDependency),
      # CI never ran the built image, and the broken image was pushed as latest.
      # Start the server image here, before any push. T-0739 checked only that the
      # modules load, with an unreachable database; T-0743 showed that misses crashes
      # after the connection (the server crashed right after migrations). So this
      # starts a throwaway postgres:17 on a docker network, starts the server image
      # against it with no MAIL_TRANSPORT, and passes only when the server logs
      # "zilar-server listening" within 90 seconds. A module error or a missing
      # listening line fails the job.
      - name: Smoke-start the server image (before any push)
        if: matrix.name == 'zilar-server'
        env:
          SMOKE_AUTH_SECRET: smoke-only-placeholder-not-a-real-secret
          SMOKE_XMPP_SECRET: smoke-only-placeholder-not-a-real-secret
        run: |
          net=zilar-smoke-net
          pg=zilar-smoke-pg
          srv=zilar-server-smoke
          trap 'docker rm -f "$srv" "$pg" >/dev/null 2>&1 || true; docker network rm "$net" >/dev/null 2>&1 || true' EXIT
          docker network create "$net" >/dev/null
          docker run -d --rm --name "$pg" --network "$net" \
            -e POSTGRES_USER=smoke -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=smoke \
            postgres:17 >/dev/null
          # The postgres entrypoint first starts a temporary server with no TCP, so
          # wait for TCP inside the container, not just the unix socket.
          for _ in $(seq 1 60); do
            if docker exec "$pg" pg_isready -h 127.0.0.1 -p 5432 -U smoke -d smoke >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker run -d --name "$srv" --network "$net" \
            -e NODE_ENV=production \
            -e DATABASE_URL="postgres://smoke:smoke@${pg}:5432/smoke" \
            -e BETTER_AUTH_SECRET="$SMOKE_AUTH_SECRET" \
            -e EJABBERD_ADMIN_JID=admin@zilar.localhost \
            -e EJABBERD_ADMIN_PASSWORD=smoke-only-placeholder \
            -e ZILAR_XMPP_JWT_SECRET="$SMOKE_XMPP_SECRET" \
            zilar-server:smoke >/dev/null
          start="$(date +%s)"
          out=""
          while :; do
            out="$(docker logs "$srv" 2>&1 || true)"
            case "$out" in
              *'zilar-server listening'*) break ;;
            esac
            running="$(docker inspect -f '{{.State.Running}}' "$srv" 2>/dev/null || echo false)"
            if [ "$running" != "true" ] || [ $(( $(date +%s) - start )) -ge 90 ]; then
              break
            fi
            sleep 2
          done
          printf '%s\n' "$out" | tail -n 40
          fail=0
          if printf '%s\n' "$out" | grep -E 'ERR_MODULE_NOT_FOUND|Cannot find package|Cannot find module'; then
            echo "::error::The server image cannot load its modules; it must not be pushed."
            fail=1
          fi
          case "$out" in
            *'zilar-server listening'*) ;;
            *)
              echo "::error::The server did not log 'zilar-server listening' within 90 seconds; it must not be pushed."
              fail=1
              ;;
          esac
          exit "$fail"

      - name: Build ${{ matrix.name }} (no push)
        if: "!startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_run'"
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # amd64 only, see the QEMU step (the arm64 leg hung for 3h18m, run 37911863834).
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            ZILAR_COMMIT=${{ steps.commit.outputs.sha }}

      - name: Build and push ${{ matrix.name }} (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # Releases stay multi-arch for self-hosters who may run ARM.
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}
          tags: |
            ${{ steps.image.outputs.ref }}:${{ github.ref_name }}
            ${{ steps.image.outputs.ref }}:latest
          build-args: |
            ZILAR_COMMIT=${{ steps.commit.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push ${{ matrix.name }} (green main)
        if: github.event_name == 'workflow_run'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # amd64 only, see the QEMU step (the live host is x86_64).
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          tags: |
            ${{ steps.image.outputs.ref }}:latest
            ${{ steps.image.outputs.ref }}:sha-${{ steps.commit.outputs.short }}
          build-args: |
            ZILAR_COMMIT=${{ steps.commit.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    # Incident T-0750: a stalled job held the publish-main group for 3h18m.
    timeout-minutes: 20
    needs: [tip, build]
    # event == 'push' keeps a fork PR that happens to use a branch named main
    # from building and deploying attacker code (see PREREVIEW finding 1).
    # A stale run (tip check said latest != true) never deploys.
    # always() is needed so a skipped `tip` (tag/PR path) does not block, but it
    # also ignores upstream failure: require build == 'success' so a failed matrix
    # leg (no new latest/sha pushed) never restarts the live service.
    if: always() && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && needs.tip.outputs.latest == 'true' && needs.build.result == 'success'
    # Two merges must never deploy at once; a newer run waits for the old one.
    concurrency:
      group: deploy-live
      cancel-in-progress: false
    steps:
      - name: Check whether auto-deploy is configured
        id: config
        env:
          AUTO_DEPLOY: ${{ vars.AUTO_DEPLOY }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_SERVICE_UUID: ${{ secrets.COOLIFY_SERVICE_UUID }}
        run: |
          if [ "${AUTO_DEPLOY:-}" = "off" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Auto-deploy disabled by the AUTO_DEPLOY repository variable; skipping."
          elif [ -z "${COOLIFY_URL:-}" ] || [ -z "${COOLIFY_TOKEN:-}" ] || [ -z "${COOLIFY_SERVICE_UUID:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Auto-deploy skipped: set COOLIFY_URL, COOLIFY_TOKEN and COOLIFY_SERVICE_UUID to enable it."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # The token is passed through the environment and never echoed.
      - name: Restart the live service and pull latest
        if: steps.config.outputs.enabled == 'true'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_SERVICE_UUID: ${{ secrets.COOLIFY_SERVICE_UUID }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL%/}/api/v1/services/${COOLIFY_SERVICE_UUID}/restart?latest=true"
          echo "Restart queued with latest=true."

      - name: Wait until /health reports the new commit
        if: steps.config.outputs.enabled == 'true'
        env:
          PUBLIC_URL: ${{ secrets.ZILAR_PUBLIC_URL || vars.ZILAR_PUBLIC_URL || 'https://chat.zilar.app' }}
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          endpoint="${PUBLIC_URL%/}/health"
          for attempt in $(seq 1 40); do
            body="$(curl --fail --silent --show-error "$endpoint" 2>/dev/null || true)"
            commit="$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)"
            ok="$(printf '%s' "$body" | jq -r '.ok // false' 2>/dev/null || true)"
            if [ "$commit" = "$EXPECTED_COMMIT" ] && [ "$ok" = "true" ]; then
              echo "Live service reports commit ${commit}."
              exit 0
            fi
            echo "Attempt ${attempt}/40: commit='${commit}' ok='${ok}'; retrying in 15s."
            sleep 15
          done
          echo "Timed out after 10 minutes waiting for ${EXPECTED_COMMIT} to be live." >&2
          exit 1
