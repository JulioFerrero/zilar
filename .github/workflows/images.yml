name: Production images

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build production images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed only when pushing on a version tag; harmless on pull requests.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: zilar-server
            file: apps/server/Dockerfile
            context: .
          - name: zilar-web
            file: apps/web/Dockerfile
            context: .
          - name: zilar-postgres
            file: deploy/postgres/Dockerfile
            context: deploy
          - name: zilar-ejabberd
            file: deploy/ejabberd/Dockerfile
            context: deploy
    steps:
      - uses: actions/checkout@v7

      # arm64 images are built on an amd64 runner, which needs emulation for their RUN steps
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # GHCR only accepts lowercase repository names
      - name: Image name
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.name }} (no push)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Build and push ${{ matrix.name }}
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}:${{ github.ref_name }}
            ${{ steps.image.outputs.ref }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
